# One-box self-hosted SAM control plane on celld (https://celld.dev).
#
#   browser / nodes --443--> caddy --127.0.0.1:CELLD_PORT--> celld (API Worker + web UI assets)
#                              |                               |  \--127.0.0.1:<lease port>--> frps --> node
#                              \--frp over wss, node WS------> frps (127.0.0.1:FRPS_BIND_PORT)
#                                                              celld --> fleet bucket (GCS, S3, or the bundled store)
#
# caddy, celld and frps share the host network on purpose: the Worker's fetch to a node's
# loopback lease port runs in celld's network namespace, and Caddy forward_auth proxies node
# WebSockets to the same port. Everything except Caddy listens on 127.0.0.1 only.
#
# Egress fence: celld runs as its own uid (CELLD_UID) and the `egress-fence` service installs an
# nftables table for that uid (.state/egress-fence.nft, rendered by the deploy script) that keeps
# Worker code away from loopback services, private ranges and the metadata server. celld's
# entrypoint (celld/start.sh) starts celld only while the fence is in effect and kills it when the
# fence goes (see README "Worst-case unfenced window"). Check it any time
# with `pnpm selfhost:verify-fence`.
#
# Usage: cp .env.example .env && chmod 600 .env && edit it; `pnpm selfhost:deploy --init`
# (platform keys + .state/gateway.env); docker compose up -d; then `pnpm selfhost:deploy`.
# Images are pinned by digest; the pinned celld version must match CELLD_VERSION in
# scripts/selfhost/versions.ts, which the deploy script uses for `celld deploy`.
name: sam-selfhost

services:
  celld:
    image: ghcr.io/denoland/celld:v0.6.3@sha256:22bca1b40a9e4c434cc149d8913d7eaafa9792961a8c05f9fecf921d416216dc
    network_mode: host
    # The egress fence matches this uid; celld/start.sh refuses to run as root.
    user: '${CELLD_UID:-7101}:${CELLD_UID:-7101}'
    # The fence matches the uid: no capability or setuid path may change it.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint: ['/bin/bash', '/etc/sam/celld-start.sh']
    depends_on:
      egress-fence:
        condition: service_healthy
      celld-data-owner:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
        required: false # only with the local-store profile
      gce-metadata-proxy:
        condition: service_started
        required: false # only with the gce profile
      key-agent:
        condition: service_healthy
    # SAM_EGRESS_FENCE_PROBES, and on a gs:// bucket GCE_METADATA_HOST/IP pointing at the token
    # proxy. Written by `pnpm selfhost:deploy --init`.
    env_file:
      - path: ${SAM_SELFHOST_STATE_DIR:-./.state}/celld.env
        required: true
    environment:
      HOME: /var/lib/celld
      # celld/start.sh: wait for the fence at start, then re-check it while celld runs; celld
      # is killed when a probe is not rejected or the fence service's attestation goes stale.
      SAM_EGRESS_FENCE_WAIT_SECONDS: ${SAM_EGRESS_FENCE_WAIT_SECONDS:-60}
      SAM_EGRESS_FENCE_CHECK_SECONDS: ${SAM_EGRESS_FENCE_CHECK_SECONDS:-1}
      SAM_EGRESS_FENCE_ATTESTATION: /run/sam-egress-fence/attestation
      SAM_EGRESS_FENCE_ATTESTATION_MAX_AGE_SECONDS: ${SAM_EGRESS_FENCE_ATTESTATION_MAX_AGE_SECONDS:-20}
      CELLD_BUCKET: ${CELLD_BUCKET:?set CELLD_BUCKET in .env}
      # Empty means unset: gs:// buckets take no endpoint and use Application Default Credentials.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      CELLD_ADDR: 127.0.0.1:${CELLD_PORT:-8080}
      # Unauthenticated operator API (work, eviction, state, shutdown): loopback only.
      CELLD_INTERNAL_ADDR: 127.0.0.1:${CELLD_INTERNAL_PORT:-7001}
      CELLD_WATCH: /var/lib/celld
      # Caddy replaces X-Forwarded-Host/-Proto, so request.url is https://<host>/...
      CELLD_TRUST_FORWARDED_HEADERS: '1'
      # Delete superseded LTX epochs; without it the bucket grows on every cell activation.
      CELLD_LTX_RETENTION_SECS: ${CELLD_LTX_RETENTION_SECS:-86400}
      # Outbound fetch timeout. celld's default (120 s) cuts Worker-proxied streams mid-body.
      # Worker-proxied node responses (file transfers, port previews) are cut at this cap.
      CELLD_FETCH_TIMEOUT_S: ${CELLD_FETCH_TIMEOUT_S:-3600}
      RUST_LOG: ${CELLD_RUST_LOG:-info}
    volumes:
      # A cache on one node: the bucket is the durable copy and the only thing to back up.
      - celld-data:/var/lib/celld
      - ./celld/start.sh:/etc/sam/celld-start.sh:ro
      - egress-fence-attestation:/run/sam-egress-fence:ro
    # Above CELLD_SHUTDOWN_TOTAL_MS (40 s) so a stop is a clean lease handoff.
    stop_grace_period: 50s
    # celld docs: restart without an attempt limit. An immediate restart can hit
    # "Address already in use"; Docker's restart backoff covers that.
    restart: unless-stopped

  # Installs the celld egress fence in the host's nftables, re-applies it if a firewall reload
  # removes it, and attests to celld that the table matches the rendered rules. Needs only
  # NET_ADMIN on the host network. Stopping it leaves the fence in place; celld then stops once
  # the attestation is older than SAM_EGRESS_FENCE_ATTESTATION_MAX_AGE_SECONDS.
  egress-fence:
    build: ./egress-fence
    image: sam-selfhost-egress-fence:local
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    environment:
      SAM_EGRESS_FENCE_RECHECK_SECONDS: ${SAM_EGRESS_FENCE_RECHECK_SECONDS:-5}
    volumes:
      - ${SAM_SELFHOST_STATE_DIR:-./.state}/egress-fence.nft:/etc/sam/egress-fence.nft:ro
      # The host's resolver list, so a changed nameserver re-opens DNS (fence.sh sync_dns).
      - /etc/resolv.conf:/etc/sam/host-resolv.conf:ro
      - egress-fence-attestation:/run/sam-egress-fence
    healthcheck:
      test: ['CMD', '/bin/sh', '/usr/local/bin/sam-egress-fence', 'check']
      interval: 5s
      retries: 12
    restart: unless-stopped

  # Gives the celld data volume to CELLD_UID (celld used to run as root). One-shot.
  celld-data-owner:
    image: sam-selfhost-egress-fence:local
    pull_policy: never # built by the egress-fence service
    depends_on:
      egress-fence:
        condition: service_started
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH]
    entrypoint:
      [
        'find',
        '/var/lib/celld',
        '(',
        '!',
        '-user',
        '${CELLD_UID:-7101}',
        '-o',
        '!',
        '-group',
        '${CELLD_UID:-7101}',
        ')',
        '-exec',
        'chown',
        '-h',
        '${CELLD_UID:-7101}:${CELLD_UID:-7101}',
        '{}',
        '+',
      ]
    volumes:
      - celld-data:/var/lib/celld
    restart: 'no'

  # Sealed Worker secrets (scripts/selfhost/key-service.ts, on by default). Holds the key provider
  # `pnpm selfhost:deploy --init` chose (key-choice.ts) and opens the sealed bundle for celld's
  # Worker over 127.0.0.1, refusing every peer uid but celld's (key-agent/peer.ts). No
  # capabilities after start, read-only root; the egress fence does not apply to it (it matches
  # celld's uid), so it can reach a key service. On a `legacy-plaintext` box it only answers its
  # health check, and the fence gives celld no route to it.
  key-agent:
    build: ./key-agent
    image: sam-selfhost-key-agent:local
    network_mode: host
    # Starts as root only to become the owner of .state/key-agent (server.ts dropToOwnerOf): the
    # bundles and the key file are that user's mode 0600 files. SETUID/SETGID are lost with the
    # switch. SAM_KEY_AGENT_UID pins the uid instead (the deploy checks it is the state owner).
    user: '${SAM_KEY_AGENT_UID:-0}'
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ['no-new-privileges:true']
    read_only: true
    env_file:
      - path: ${SAM_SELFHOST_STATE_DIR:-./.state}/key-agent/agent.env
        required: true
    environment:
      SAM_KEY_AGENT_ALLOWED_UIDS: ${CELLD_UID:-7101}
      SAM_KEY_AGENT_STATE_DIR: /etc/sam/key-agent
    volumes:
      - ${SAM_SELFHOST_STATE_DIR:-./.state}/key-agent:/etc/sam/key-agent:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:'+(process.env.SAM_KEY_AGENT_PORT||7190)+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Token proxy for celld's gs:// bucket on GCE (deploy/selfhost/metadata-proxy/Caddyfile): the
  # fence blocks the metadata server, so celld fetches its access token here instead.
  gce-metadata-proxy:
    profiles: [gce]
    image: sam-selfhost-caddy:local
    pull_policy: never # built by the caddy service
    network_mode: host
    cap_drop: [ALL]
    # The caddy binary carries the file capability cap_net_bind_service; exec fails without it
    # in the bounding set. It listens on a high loopback port.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/data, /config]
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile']
    env_file:
      - path: ${SAM_SELFHOST_STATE_DIR:-./.state}/celld.env
        required: true
    volumes:
      - ./metadata-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  caddy:
    build:
      context: ./caddy
      args:
        CADDY_DNS_MODULE: ${CADDY_DNS_MODULE:-github.com/caddy-dns/googleclouddns@v1.1.0}
    image: sam-selfhost-caddy:local
    network_mode: host
    # Internet-facing and holds the DNS-01 identity: only the capability to bind 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on: [celld]
    # Hashes the mail collector's UI password (when that profile is on) before starting Caddy.
    entrypoint: ['/bin/sh', '/etc/caddy/start.sh']
    # REVERSE_TUNNEL_GATEWAY_SECRET (sent on forward_auth). Written by `pnpm selfhost:deploy --init`.
    # mail-collector.env: SAM_MAIL_COLLECTOR=on|off and the collector UI password (on only).
    env_file:
      - path: ${SAM_SELFHOST_STATE_DIR:-./.state}/gateway.env
        required: true
      - path: ${SAM_SELFHOST_STATE_DIR:-./.state}/mail-collector.env
        required: false
    environment:
      SAM_DOMAIN: ${SAM_DOMAIN:?set SAM_DOMAIN in .env}
      SAM_TLS_MODE: ${SAM_TLS_MODE:?set SAM_TLS_MODE in .env (internal or dns-<provider>)}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      GCP_PROJECT: ${GCP_PROJECT:-}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      CELLD_PORT: ${CELLD_PORT:-8080}
      FRPS_BIND_PORT: ${FRPS_BIND_PORT:-7000}
      # Keep-warm for celld's stateless Worker isolate (caddy/keep-warm/on.caddy): on unless set
      # to off; the interval (1s-6s) sets how long a cold window follows each 30 s celld pool tick.
      # start.sh validates both.
      SAM_KEEP_WARM: ${SAM_KEEP_WARM:-on}
      SAM_KEEP_WARM_INTERVAL: ${SAM_KEEP_WARM_INTERVAL:-5s}
    # The access log goes to stdout (README "Logs"). Docker's default json-file driver never
    # rotates, so cap this service's log: about CADDY_LOG_MAX_SIZE x CADDY_LOG_MAX_FILES on disk.
    logging:
      driver: json-file
      options:
        max-size: ${CADDY_LOG_MAX_SIZE:-50m}
        max-file: '${CADDY_LOG_MAX_FILES:-5}'
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  frps:
    profiles: [tunnel]
    image: ghcr.io/fatedier/frps:v0.72.0@sha256:17abb20dd392557a44070d9726954630c0eb1f7a9bd6ead5ae9150d165179ea4
    network_mode: host
    command: ['-c', '/etc/frp/frps.toml']
    # REVERSE_TUNNEL_GATEWAY_SECRET (frps server-plugin auth) and the lease port range.
    # Written by `pnpm selfhost:deploy --init`.
    env_file:
      - path: ${SAM_SELFHOST_STATE_DIR:-./.state}/gateway.env
        required: true
    environment:
      FRPS_BIND_PORT: ${FRPS_BIND_PORT:-7000}
      CELLD_PORT: ${CELLD_PORT:-8080}
      SAM_DOMAIN: ${SAM_DOMAIN:?set SAM_DOMAIN in .env}
      # REVERSE_TUNNEL_PORT_RANGE_START/END come from gateway.env: the deploy script writes the
      # same resolved range there and into the Worker's vars (scripts/selfhost/box-settings.ts).
    volumes:
      - ./frps:/etc/frp:ro
    restart: unless-stopped

  # Mail collector for TEST installs (profile `mail-collector`, off by default): catches every
  # email SAM sends (sign-in codes) so it can be read at https://mail.SAM_DOMAIN behind basic
  # auth (caddy/mail-collector/on.caddy). Anyone who can read it can sign in as any account.
  # SMTP and the UI listen on loopback only; the deploy points the Worker at the SMTP port
  # (scripts/selfhost/mail-settings.ts) and refuses the profile without the generated UI password.
  mail-collector:
    profiles: [mail-collector]
    # Mailpit v1.33.1
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    network_mode: host
    user: '65534:65534'
    # MP_UI_AUTH=collector:<generated password>: Mailpit requires it for its UI, API and send API
    # too, so nothing on the box (celld included) reads codes on loopback without it. Written by
    # `pnpm selfhost:deploy --init`; compose refuses to start the collector without the file.
    env_file:
      - path: ${SAM_SELFHOST_STATE_DIR:-./.state}/mail-collector-ui.env
        required: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command:
      - --smtp
      - 127.0.0.1:${MAIL_COLLECTOR_SMTP_PORT:-1025}
      - --listen
      - 127.0.0.1:${MAIL_COLLECTOR_UI_PORT:-8025}
      # Messages live in /tmp (tmpfs) and are gone on restart; codes expire in minutes anyway.
      - --max-age
      - 1d
      - --disable-version-check
      - --smtp-disable-rdns
      - --block-remote-css-and-fonts
    restart: unless-stopped

  # Inbound agent email (profile `mail-in`, off by default): sam-mx (./sam-mx) accepts SMTP on
  # port 25 for agent+<key>@agents.SAM_DOMAIN only, requires aligned SPF or DKIM (DMARC pass) for
  # the From domain, and hands each message during the SMTP session to the Worker's loopback
  # gateway route (POST /api/self-host/gateway/inbound-email, which Caddy hides from the internet).
  # Refusals are SMTP replies (550/552/451): it never relays, bounces, or sends mail. Replies to
  # senders go out through the Worker's SMTP relay (SMTP_* or the mail-collector profile), which
  # the deploy requires when this profile is on. Needs the MX record and an inbound tcp/25
  # firewall rule (README "Inbound agent email").
  sam-mx:
    profiles: [mail-in]
    build: ./sam-mx
    image: sam-selfhost-sam-mx:local
    # Host network: it calls celld on 127.0.0.1, and the sender's address must be the real one for
    # SPF and the per-address limits. Its own uid, not celld's: the egress fence (which matches
    # celld's uid) does not apply to it, and celld's fence does not let the Worker reach port 25.
    network_mode: host
    user: '${SAM_MX_UID:-7102}:${SAM_MX_UID:-7102}'
    # The binary's file capability binds port 25; every other capability is dropped.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    read_only: true
    # Parses untrusted mail before authentication: bound its memory and processes so a flood
    # cannot push celld or Caddy into the OOM killer. SAM_MX_MAX_CONNECTIONS (20) x 5 MiB
    # messages, plus the copies the checks make, fits well inside this.
    mem_limit: ${SAM_MX_MEM_LIMIT:-512m}
    pids_limit: 128
    depends_on: [celld]
    # REVERSE_TUNNEL_GATEWAY_SECRET, the gateway route's shared secret. Written by
    # `pnpm selfhost:deploy --init`.
    env_file:
      - path: ${SAM_SELFHOST_STATE_DIR:-./.state}/gateway.env
        required: true
    environment:
      SAM_DOMAIN: ${SAM_DOMAIN:?set SAM_DOMAIN in .env}
      CELLD_PORT: ${CELLD_PORT:-8080}
      SAM_MX_LISTEN: ${SAM_MX_LISTEN:-:25}
      SAM_MX_HOSTNAME: ${SAM_MX_HOSTNAME:-}
      SAM_MX_MAX_MESSAGE_BYTES: ${SAM_MX_MAX_MESSAGE_BYTES:-}
      SAM_MX_MAX_CONNECTIONS: ${SAM_MX_MAX_CONNECTIONS:-}
      SAM_MX_MAX_CONNECTIONS_PER_IP: ${SAM_MX_MAX_CONNECTIONS_PER_IP:-}
      SAM_MX_MAX_SESSION: ${SAM_MX_MAX_SESSION:-}
      # The Go runtime collects harder as it nears this, below mem_limit.
      GOMEMLIMIT: ${SAM_MX_GOMEMLIMIT:-400MiB}
      SAM_MX_CONNECTIONS_PER_IP_PER_MINUTE: ${SAM_MX_CONNECTIONS_PER_IP_PER_MINUTE:-}
      SAM_MX_MESSAGES_PER_CONNECTION: ${SAM_MX_MESSAGES_PER_CONNECTION:-}
      SAM_MX_GATEWAY_TIMEOUT: ${SAM_MX_GATEWAY_TIMEOUT:-}
      # Loopback CIDRs whose mail skips SPF/DKIM/DMARC (smoke tests from the box itself). Empty
      # by default; the receiver refuses any non-loopback network here.
      SAM_MX_TRUSTED_NETWORKS: ${SAM_MX_TRUSTED_NETWORKS:-}
      # Optional STARTTLS certificate and key, mounted read-only by an override file.
      SAM_MX_TLS_CERT: ${SAM_MX_TLS_CERT:-}
      SAM_MX_TLS_KEY: ${SAM_MX_TLS_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: ${SAM_MX_LOG_MAX_SIZE:-20m}
        max-file: '${SAM_MX_LOG_MAX_FILES:-3}'
    restart: unless-stopped

  # Bundled object store for boxes without an external bucket. celld does not qualify it for
  # production (MinIO community fork; it passes celld's storage test). Prefer GCS/S3/R2/Azure.
  objectstore:
    profiles: [local-store]
    # pgsty/minio RELEASE.2026-08-04T00-00-00Z (minio/minio images are no longer published).
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    network_mode: host
    command:
      [
        'server',
        '/data',
        '--address',
        '127.0.0.1:${OBJECTSTORE_PORT:-9000}',
        '--console-address',
        '127.0.0.1:${OBJECTSTORE_CONSOLE_PORT:-9001}',
      ]
    # Compose interpolates every service, including ones whose profile is off, so a `:?` here
    # would stop a gs:// or s3:// install that never runs this store. The store checks instead:
    # it refuses an unset credential (MinIO would fall back to minioadmin), MinIO's well-known
    # default, and a secret under 8 characters. /usr/bin/docker-entrypoint.sh is the image's
    # own ENTRYPOINT at the pinned digest.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        case "$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD" in
        :* | *: | minioadmin:* | *:minioadmin)
        echo 'objectstore: set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in .env (not minioadmin)' >&2; exit 64;;
        esac;
        test "$${#MINIO_ROOT_PASSWORD}" -ge 8 ||
        { echo 'objectstore: AWS_SECRET_ACCESS_KEY must be at least 8 characters' >&2; exit 64; };
        exec /usr/bin/docker-entrypoint.sh "$$@"
      - objectstore
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 30
    stop_grace_period: 30s
    restart: unless-stopped

  objectstore-init:
    profiles: [local-store]
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    network_mode: host
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: ['sh', '/init/init.sh']
    environment:
      OBJECTSTORE_URL: http://127.0.0.1:${OBJECTSTORE_PORT:-9000}
      CELLD_BUCKET: ${CELLD_BUCKET:?set CELLD_BUCKET in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./objectstore/init.sh:/init/init.sh:ro
    restart: 'no'

volumes:
  celld-data:
  egress-fence-attestation:
  caddy-data:
  caddy-config:
  objectstore-data:
