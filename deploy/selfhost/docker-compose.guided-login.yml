# Guided credential login (opt-in). Use with SAM_GUIDED_LOGIN=on in .env and
#   COMPOSE_FILE=docker-compose.yml:docker-compose.guided-login.yml
# (paths relative to deploy/selfhost; README "Guided credential login").
#
# celld starts the sign-in sandbox through Docker, but it never holds the Docker socket: that
# socket is root on this host. It talks to `docker-proxy` instead, which allows only the calls
# celld's container support makes, in their exact shapes (one sandbox image, the gVisor runtime,
# no capabilities, celld's fenced bridges, its one-shot fence container) and refuses the rest
# (docker-proxy/policy.ts; what a compromised celld can and cannot do is in the README).
services:
  # Gives the socket volume to the proxy uid. A fresh volume takes the image's ownership, but an
  # existing one keeps the uid it was created with, so changing SAM_DOCKER_PROXY_UID would leave
  # the proxy unable to bind its socket. One-shot; root only for chown/chmod of one directory.
  docker-proxy-socket-owner:
    image: sam-selfhost-docker-proxy:local
    pull_policy: never # built by the docker-proxy service
    network_mode: none
    user: '0:0'
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    entrypoint:
      - /bin/sh
      - -c
      - 'chown "$$0:$$1" /run/sam-docker-proxy && chmod 0750 /run/sam-docker-proxy'
      - '${SAM_DOCKER_PROXY_UID:-7103}'
      - '${CELLD_UID:-7101}'
    volumes:
      - docker-proxy-socket:/run/sam-docker-proxy
    restart: 'no'

  docker-proxy:
    build:
      context: ./docker-proxy
      args:
        PROXY_UID: ${SAM_DOCKER_PROXY_UID:-7103}
        CELLD_GID: ${CELLD_UID:-7101}
    image: sam-selfhost-docker-proxy:local
    depends_on:
      docker-proxy-socket-owner:
        condition: service_completed_successfully
    # Unix sockets only: the host's Docker socket in, the proxy socket out.
    network_mode: none
    user: '${SAM_DOCKER_PROXY_UID:-7103}:${CELLD_UID:-7101}'
    # The socket's group, so the proxy uid can reach the daemon without being root.
    group_add: ['${DOCKER_SOCKET_GID:?set DOCKER_SOCKET_GID (stat -c %g /var/run/docker.sock)}']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    environment:
      # Sandboxes older than this are removed (a setup session lives at most 15 minutes by
      # default; raise this if you raise the setup-session TTL).
      SAM_DOCKER_PROXY_MAX_SANDBOX_AGE_SECONDS: ${SAM_DOCKER_PROXY_MAX_SANDBOX_AGE_SECONDS:-1800}
      # Most celld containers (sign-in sandboxes and fence runs) at once, whatever celld asks for.
      SAM_DOCKER_PROXY_MAX_CONTAINERS: ${SAM_DOCKER_PROXY_MAX_CONTAINERS:-4}
    # Bounded so a misbehaving (or compromised) celld cannot exhaust the host through it.
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-proxy-socket:/run/sam-docker-proxy
      # policy.json and the sandbox resolv.conf, written by `pnpm selfhost:deploy`.
      - ${SAM_SELFHOST_STATE_DIR:-./.state}/docker-proxy:/etc/sam/docker-proxy:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({socketPath:'/run/sam-docker-proxy/docker.sock',path:'/_ping'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      retries: 12
    restart: unless-stopped

  celld:
    depends_on:
      docker-proxy:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///run/sam-docker-proxy/docker.sock
    volumes:
      - docker-proxy-socket:/run/sam-docker-proxy:ro

volumes:
  docker-proxy-socket:
