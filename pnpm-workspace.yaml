packages:
  - 'apps/*'
  - 'packages/*'
  - 'infra'
  - 'tools/*'

catalog:
  # === Build & Dev Tooling ===
  typescript: 5.9.3
  vite: 8.1.3
  # @vitest/coverage-v8 peer-depends on an EXACT vitest version (not a range),
  # so these two must move together. Keep in sync with the Vitest Ecosystem block.
  vitest: 4.1.7
  tsx: 4.23.1
  '@eslint/js': 9.39.5
  '@astrojs/check': 0.9.10
  eslint: 9.39.5
  eslint-plugin-astro: 1.7.0
  globals: 17.9.0
  oxlint: 1.77.0
  jsdom: 29.1.1

  # === Vitest Ecosystem ===
  '@vitest/coverage-v8': 4.1.7
  '@vitejs/plugin-react': 5.2.0

  # === TypeScript ESLint ===
  # Released in lockstep from one monorepo — keep aligned so the parser and plugin
  # always agree on the AST/rule surface. Dependabot only proposes the parser.
  '@typescript-eslint/eslint-plugin': 8.67.0
  '@typescript-eslint/parser': 8.67.0
  typescript-eslint: 8.67.0

  # === Cloudflare ===
  '@cloudflare/workers-types': 5.20260707.1
  wrangler: 4.123.0

  # === React Ecosystem ===
  # react and react-dom ship from one repo and must stay on the same version —
  # react-dom loads the matching reconciler build. Dependabot groups react with
  # @types/react but not react-dom, so bump react-dom by hand alongside react.
  react: 19.2.8
  react-dom: 19.2.8
  eslint-plugin-react: 7.37.5
  eslint-plugin-react-hooks: 7.1.1
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.3
  react-router: 7.14.2
  lucide-react: 0.460.0

  # === Testing ===
  '@testing-library/dom': 10.4.1
  '@testing-library/react': 16.3.2
  '@testing-library/jest-dom': 6.9.1

  # === Shared Libraries ===
  better-auth: 1.6.11
  zod: 3.25.76
  valibot: 1.3.1
  execa: 9.6.1
  prism-react-renderer: 2.4.1
  react-markdown: 10.1.0
  react-virtuoso: 4.18.10
  remark-gfm: 4.0.1

  # === Terminal ===
  '@xterm/xterm': 5.5.0
  '@xterm/addon-fit': 0.10.0

  # === Types ===
  '@types/node': 22.19.7
