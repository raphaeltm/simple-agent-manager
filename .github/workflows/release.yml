name: Create Release

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: read

jobs:
  release:
    name: Tag and release the latest production deploy
    if: github.repository == 'raphaeltm/simple-agent-manager'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find latest successful production deploy SHA
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          deployments=$(gh api --paginate "repos/${GH_REPOSITORY}/deployments?environment=production&per_page=100")
          DEPLOY_SHA=$(
            jq -r '.[] | select((.payload | type) == "object" and .payload.workflow == "deploy.yml" and .payload.dry_run == false) | [.id, .sha] | @tsv' <<< "$deployments" |
              while IFS=$'\t' read -r deployment_id deployment_sha; do
                latest_state=$(gh api "repos/${GH_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" --jq '.[0].state // empty')
                if [ "$latest_state" = "success" ]; then
                  echo "$deployment_sha"
                  break
                fi
              done
          )

          if [ -z "$DEPLOY_SHA" ]; then
            echo "No successful non-dry-run production deployment marker found. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Latest deployed SHA: $DEPLOY_SHA"

      - name: Determine tag name
        if: steps.deploy.outputs.skip != 'true'
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          TODAY=$(date -u +%Y.%m.%d)
          BASE_TAG="v${TODAY}"

          TAG_NAME="$BASE_TAG"
          SUFFIX=0
          while git rev-parse "$TAG_NAME" >/dev/null 2>&1; do
            TAG_SHA=$(git rev-list -n 1 "$TAG_NAME")
            if [ "$TAG_SHA" = "$DEPLOY_SHA" ]; then
              if gh release view "$TAG_NAME" >/dev/null 2>&1; then
                echo "Release $TAG_NAME already exists for $DEPLOY_SHA. Skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "Tag $TAG_NAME already exists for $DEPLOY_SHA without a published release."
              echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            SUFFIX=$((SUFFIX + 1))
            TAG_NAME="${BASE_TAG}.${SUFFIX}"
          done

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Will create tag: $TAG_NAME"

      - name: Create tag and release
        if: steps.deploy.outputs.skip != 'true' && steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
          TAG_EXISTS: ${{ steps.tag.outputs.tag_exists }}
          DEPLOY_SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          if [ "$TAG_EXISTS" != "true" ]; then
            git tag -a "$TAG_NAME" "$DEPLOY_SHA" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

          gh release create "$TAG_NAME" \
            --target "$DEPLOY_SHA" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "$TAG_NAME"

          echo "Created release $TAG_NAME at $DEPLOY_SHA"
