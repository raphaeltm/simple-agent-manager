          RATE_LIMIT_REPORT_ISSUE_POST: ${{ vars.RATE_LIMIT_REPORT_ISSUE_POST }}
          PLATFORM_FEEDBACK_TRIAGE_WINDOW_MINUTES: ${{ vars.PLATFORM_FEEDBACK_TRIAGE_WINDOW_MINUTES }}
          PLATFORM_FEEDBACK_TRIAGE_ERROR_LIMIT: ${{ vars.PLATFORM_FEEDBACK_TRIAGE_ERROR_LIMIT }}
          PLATFORM_FEEDBACK_TRIAGE_GROUP_LIMIT: ${{ vars.PLATFORM_FEEDBACK_TRIAGE_GROUP_LIMIT }}
