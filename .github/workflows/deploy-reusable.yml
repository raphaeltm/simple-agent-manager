          WEB_PUSH_TTL_SECONDS: ${{ vars.WEB_PUSH_TTL_SECONDS }}
          WEB_PUSH_VAPID_TTL_SECONDS: ${{ vars.WEB_PUSH_VAPID_TTL_SECONDS }}
          WEB_PUSH_DELIVERY_TIMEOUT_MS: ${{ vars.WEB_PUSH_DELIVERY_TIMEOUT_MS }}
          WEB_PUSH_DELIVERY_BUDGET_MS: ${{ vars.WEB_PUSH_DELIVERY_BUDGET_MS }}
          WEB_PUSH_FANOUT_CONCURRENCY: ${{ vars.WEB_PUSH_FANOUT_CONCURRENCY }}
          WEB_PUSH_MAX_ATTEMPTS: ${{ vars.WEB_PUSH_MAX_ATTEMPTS }}
          WEB_PUSH_MAX_RETRY_AFTER_SECONDS: ${{ vars.WEB_PUSH_MAX_RETRY_AFTER_SECONDS }}
          WEB_PUSH_MAX_PAYLOAD_BYTES: ${{ vars.WEB_PUSH_MAX_PAYLOAD_BYTES }}
          WEB_PUSH_FAILURE_THRESHOLD: ${{ vars.WEB_PUSH_FAILURE_THRESHOLD }}
          WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER: ${{ vars.WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER }}
          WEB_PUSH_USER_AGENT_MAX_LENGTH: ${{ vars.WEB_PUSH_USER_AGENT_MAX_LENGTH }}
          RATE_LIMIT_PUSH_SUBSCRIPTION: ${{ vars.RATE_LIMIT_PUSH_SUBSCRIPTION }}
          HUMAN_INPUT_TIMEOUT_MS: ${{ vars.HUMAN_INPUT_TIMEOUT_MS }}
          HUMAN_INPUT_ESCALATION_FRACTIONS: ${{ vars.HUMAN_INPUT_ESCALATION_FRACTIONS }}
          HUMAN_INPUT_UNDELIVERED_GRACE_MS: ${{ vars.HUMAN_INPUT_UNDELIVERED_GRACE_MS }}
          HUMAN_INPUT_MAX_WAIT_MS: ${{ vars.HUMAN_INPUT_MAX_WAIT_MS }}
          DURABLE_PROMPT_DELIVERY_ENABLED: ${{ vars.DURABLE_PROMPT_DELIVERY_ENABLED }}
          PROMPT_DELIVERY_LEGACY_VM_COMPAT_ENABLED: ${{ vars.PROMPT_DELIVERY_LEGACY_VM_COMPAT_ENABLED }}
          PROMPT_DELIVERY_MAX_CANDIDATES_PER_ALARM: ${{ vars.PROMPT_DELIVERY_MAX_CANDIDATES_PER_ALARM }}
          PROMPT_DELIVERY_MAX_ATTEMPTS: ${{ vars.PROMPT_DELIVERY_MAX_ATTEMPTS }}
          PROMPT_DELIVERY_RETRY_BASE_MS: ${{ vars.PROMPT_DELIVERY_RETRY_BASE_MS }}
          PROMPT_DELIVERY_RETRY_MAX_MS: ${{ vars.PROMPT_DELIVERY_RETRY_MAX_MS }}
          PROMPT_DELIVERY_TTL_MS: ${{ vars.PROMPT_DELIVERY_TTL_MS }}
          PROMPT_DELIVERY_RECEIPT_TIMEOUT_MS: ${{ vars.PROMPT_DELIVERY_RECEIPT_TIMEOUT_MS }}
          PROMPT_DELIVERY_BACKGROUND_TIMEOUT_MS: ${{ vars.PROMPT_DELIVERY_BACKGROUND_TIMEOUT_MS }}
          PROMPT_DELIVERY_MIN_ALARM_DELAY_MS: ${{ vars.PROMPT_DELIVERY_MIN_ALARM_DELAY_MS }}
          ACP_LONG_TURN_SUPERVISOR_ENABLED: ${{ vars.ACP_LONG_TURN_SUPERVISOR_ENABLED }}
          ACP_LONG_TURN_CHECKPOINT_MS: ${{ vars.ACP_LONG_TURN_CHECKPOINT_MS }}
          ACP_CHECKPOINT_PREEMPT_GRACE_MS: ${{ vars.ACP_CHECKPOINT_PREEMPT_GRACE_MS }}
          DO_MIGRATION_STATE_PROBE_ATTEMPTS: ${{ vars.DO_MIGRATION_STATE_PROBE_ATTEMPTS }}
          DO_MIGRATION_STATE_PROBE_RETRY_DELAY_MS: ${{ vars.DO_MIGRATION_STATE_PROBE_RETRY_DELAY_MS }}
          CF_CONTAINER_ENABLED: ${{ vars.CF_CONTAINER_ENABLED }}
          CF_CONTAINER_SLEEP_AFTER: ${{ vars.CF_CONTAINER_SLEEP_AFTER }}
          CF_CONTAINER_ACTIVE_WORK_MAX_MS: ${{ vars.CF_CONTAINER_ACTIVE_WORK_MAX_MS }}
          CF_CONTAINER_KEEPALIVE_RENEW_INTERVAL_MS: ${{ vars.CF_CONTAINER_KEEPALIVE_RENEW_INTERVAL_MS }}
          CF_CONTAINER_PORT_READY_TIMEOUT_MS: ${{ vars.CF_CONTAINER_PORT_READY_TIMEOUT_MS }}
          CF_CONTAINER_WAKE_TIMEOUT_MS: ${{ vars.CF_CONTAINER_WAKE_TIMEOUT_MS }}
          CF_CONTAINER_RECOVERY_MAX_ATTEMPTS: ${{ vars.CF_CONTAINER_RECOVERY_MAX_ATTEMPTS }}
          CF_CONTAINER_CREATE_WORKSPACE_TIMEOUT_MS: ${{ vars.CF_CONTAINER_CREATE_WORKSPACE_TIMEOUT_MS }}
          CF_CONTAINER_CLONE_FILTER: ${{ vars.CF_CONTAINER_CLONE_FILTER }}
          CF_CONTAINER_VM_AGENT_PORT: ${{ vars.CF_CONTAINER_VM_AGENT_PORT }}
          SANDBOX_CONTAINER_MAX_INSTANCES: ${{ vars.SANDBOX_CONTAINER_MAX_INSTANCES }}
          VM_AGENT_CONTAINER_MAX_INSTANCES: ${{ vars.VM_AGENT_CONTAINER_MAX_INSTANCES }}
          SANDBOX_ENABLED: ${{ vars.SANDBOX_ENABLED }}
          MAX_CONCURRENT_SETUP_SESSIONS: ${{ vars.MAX_CONCURRENT_SETUP_SESSIONS }}
          SETUP_SESSION_TTL_MS: ${{ vars.SETUP_SESSION_TTL_MS }}
          SETUP_SESSION_CAPTURE_POLL_MS: ${{ vars.SETUP_SESSION_CAPTURE_POLL_MS }}
          CODEX_DEVICE_AUTH_REQUEST_TIMEOUT_MS: ${{ vars.CODEX_DEVICE_AUTH_REQUEST_TIMEOUT_MS }}
          SETUP_SESSION_SWEEP_MAX_CANDIDATES: ${{ vars.SETUP_SESSION_SWEEP_MAX_CANDIDATES }}
          POOL_LEASE_BUFFER_MS: ${{ vars.POOL_LEASE_BUFFER_MS }}
          SANDBOX_EXEC_TIMEOUT_MS: ${{ vars.SANDBOX_EXEC_TIMEOUT_MS }}
          SANDBOX_VM_AGENT_PORT: ${{ vars.SANDBOX_VM_AGENT_PORT }}

      - name: Configure R2 CORS
        if: ${{ inputs.dry_run != true }}
        run: |
          R2_BUCKET_NAME=$(cd infra && pulumi stack output r2Name)
          export R2_BUCKET_NAME
          bash scripts/deploy/configure-r2-cors.sh
        env:
          # AWS_* for Pulumi R2 backend (pulumi stack output)
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          # CF_API_TOKEN for Cloudflare REST API (R2 bucket CORS)
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ steps.deploy_resources.outputs.base_domain }}

      - name: Configure AI Gateway
        if: ${{ inputs.dry_run != true }}
        run: bash scripts/deploy/configure-ai-gateway.sh
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ steps.deploy_resources.outputs.ai_gateway }}

      - name: Check First Deploy Status
        id: first_deploy
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -f .wrangler/tail-worker-first-deploy ]; then
            echo "is_first=true" >> $GITHUB_OUTPUT
            echo "First deploy detected -- will do two-pass deployment"
          else
            echo "is_first=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure workers.dev Subdomain
        if: ${{ inputs.dry_run != true }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RESOURCE_PREFIX: ${{ steps.deploy_resources.outputs.prefix }}
        run: |
          SUBDOMAIN="$RESOURCE_PREFIX"
          echo "Ensuring workers.dev subdomain is initialized: ${SUBDOMAIN}.workers.dev"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"subdomain\": \"${SUBDOMAIN}\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "workers.dev subdomain ready: ${SUBDOMAIN}.workers.dev"
          elif [ "$HTTP_CODE" -eq 409 ]; then
            echo "workers.dev subdomain already configured (OK)"
          else
            echo "::error::Failed to set workers.dev subdomain (HTTP ${HTTP_CODE}): ${BODY}"
            echo "Deployment cannot continue because Cloudflare cron triggers require the workers.dev subdomain prerequisite."
            echo "Initialize manually: CF Dashboard > Workers & Pages > Settings > Domains & Routes"
            exit 1
          fi

      # Verify Pages custom domain is active (must run BEFORE Worker deploys wildcard routes)
      - name: Verify Pages Custom Domain
        if: ${{ inputs.dry_run != true }}
        run: bash scripts/deploy/verify-pages-domain.sh
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PAGES_PROJECT: ${{ steps.deploy_resources.outputs.web_pages_project }}
          PAGES_DOMAIN: ${{ steps.deploy_resources.outputs.pages_domain }}

      # ========================================
      # Phase 3: Application (Wrangler)
      # ========================================
      - name: Build Applications
        if: ${{ inputs.dry_run != true }}
        run: pnpm build
        env:
          VITE_API_URL: https://api.${{ vars.BASE_DOMAIN }}
          VITE_PUBLIC_WEBSITE_URL: ${{ vars.PUBLIC_WEBSITE_URL || '' }}
          VITE_FEATURE_MULTI_TERMINAL: 'true'
          VITE_DEBUG_DIAGNOSIS_EVENT_MAX_PAGES: ${{ vars.VITE_DEBUG_DIAGNOSIS_EVENT_MAX_PAGES || '100' }}
          VITE_PROJECT_LIST_LIMIT: ${{ vars.VITE_PROJECT_LIST_LIMIT || '50' }}
          VITE_PROJECT_POLL_INTERVAL_MS: ${{ vars.VITE_PROJECT_POLL_INTERVAL_MS || '30000' }}
          VITE_SIDEBAR_PROJECT_POLL_INTERVAL_MS: ${{ vars.VITE_SIDEBAR_PROJECT_POLL_INTERVAL_MS || '60000' }}
          VITE_PROJECT_PREFETCH_DELAY_MS: ${{ vars.VITE_PROJECT_PREFETCH_DELAY_MS || '120' }}
          VITE_BACKGROUND_FETCH_DELAY_MS: ${{ vars.VITE_BACKGROUND_FETCH_DELAY_MS || '150' }}

      # Bake the deployment-built vm-agent before Wrangler builds the raw container.
      - name: Setup Go for Container Runtime
        if: ${{ inputs.dry_run != true }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Assert Go version
        if: ${{ inputs.dry_run != true }}
        run: go version | grep -E '^go version go1\.26\.6 '

      - name: Prepare Versioned VM Agent Container Artifact
        if: ${{ inputs.dry_run != true }}
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          make -C packages/vm-agent prepare-container VERSION="$DEPLOY_SHA" BUILD_DATE="$BUILD_DATE"
          cat apps/api/container-artifacts/vm-agent-version.json
          echo "### CF Container runtime artifact" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat apps/api/container-artifacts/vm-agent-version.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_SHA: ${{ steps.deploy-sha.outputs.value }}

      - name: Run Database Migrations With Safety Gates
        if: ${{ inputs.dry_run != true }}
        working-directory: infra
        run: |
          DB_NAME=$(pulumi stack output d1DatabaseName)
          OBS_DB_NAME=$(pulumi stack output observabilityD1DatabaseName)
          cd ../apps/api
          pnpm tsx ../../scripts/deploy/d1-migration-safety.ts \
            --env "$DEPLOY_ENV" \
            --database=DATABASE:$DB_NAME \
            --database=OBSERVABILITY_DATABASE:$OBS_DB_NAME
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ steps.deploy_resources.outputs.environment }}
          D1_MIGRATION_CHURNING_TABLES: ${{ vars.D1_MIGRATION_CHURNING_TABLES }}
          D1_MIGRATION_CHURNING_TABLE_MAX_DECREASE_PERCENT: ${{ vars.D1_MIGRATION_CHURNING_TABLE_MAX_DECREASE_PERCENT }}

      # Publish VM-agent binaries before deploying Worker code that may require
      # this exact build via VM_AGENT_REQUIRED_VERSION. When skip_agent is true,
      # the sync step leaves VM_AGENT_REQUIRED_VERSION empty so existing nodes are
      # not drained for binaries this deployment intentionally did not publish.
      - name: Build VM Agent
        if: ${{ inputs.dry_run != true && inputs.skip_agent != true }}
        # Pin VERSION to the deploy commit so R2 binaries report the same
        # version string as the container-baked binary (prepare-container above).
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          make -C packages/vm-agent build-all VERSION="$DEPLOY_SHA" BUILD_DATE="$BUILD_DATE"
        env:
          DEPLOY_SHA: ${{ steps.deploy-sha.outputs.value }}

      - name: Upload VM Agent Binaries
        if: ${{ inputs.dry_run != true && inputs.skip_agent != true }}
        working-directory: infra
        run: |
          R2_BUCKET=$(pulumi stack output r2Name)
          # Wrangler v4: R2 commands default to local; --remote required for deployed R2.
          pnpm --filter @simple-agent-manager/api exec wrangler r2 object put $R2_BUCKET/agents/vm-agent-linux-amd64 --file $GITHUB_WORKSPACE/packages/vm-agent/bin/vm-agent-linux-amd64 --remote
          pnpm --filter @simple-agent-manager/api exec wrangler r2 object put $R2_BUCKET/agents/vm-agent-linux-arm64 --file $GITHUB_WORKSPACE/packages/vm-agent/bin/vm-agent-linux-arm64 --remote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Deploy API worker after D1 migrations so new code never serves against old schema.
      # On first deploy this still runs before the tail worker because the API service binding is required.
      - name: Deploy API Worker
        if: ${{ inputs.dry_run != true }}
        run: |
          OUTPUT=$(pnpm --filter @simple-agent-manager/api exec wrangler deploy --env "$DEPLOY_ENV" 2>&1) || {
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "not inherited by environments"; then
            NON_ARTIFACTS_BINDING_WARNINGS=$(echo "$OUTPUT" | grep -E '      - "[^"]+" exists at the top level' | grep -v '"artifacts" exists at the top level' || true)
            if [ -z "$NON_ARTIFACTS_BINDING_WARNINGS" ] && [ "${ARTIFACTS_BINDING_ENABLED:-false}" != "true" ] && echo "$OUTPUT" | grep -q '"artifacts" exists at the top level'; then
              echo "::notice::Ignoring intentionally gated Artifacts binding warning because ARTIFACTS_BINDING_ENABLED is not true."
              exit 0
            fi
            echo ""
            echo "::error::Wrangler detected non-inherited bindings. Check sync-wrangler-config.ts."
            echo "See: .claude/rules/07-env-and-urls.md"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DEPLOY_ENV: ${{ steps.deploy_resources.outputs.environment }}
          ARTIFACTS_BINDING_ENABLED: ${{ vars.ARTIFACTS_BINDING_ENABLED }}

      # Tail Worker must deploy AFTER API Worker (service binding dependency)
      - name: Deploy Tail Worker
        if: ${{ inputs.dry_run != true }}
        run: pnpm --filter @simple-agent-manager/tail-worker exec wrangler deploy --env "$DEPLOY_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ steps.deploy_resources.outputs.environment }}

      # On first deploy: tail worker now exists, re-sync to add tail_consumers and re-deploy API
      - name: Re-sync Wrangler Config (add tail_consumers)
        if: ${{ inputs.dry_run != true && steps.first_deploy.outputs.is_first == 'true' }}
        run: |
          rm -f .wrangler/tail-worker-first-deploy
          pnpm tsx scripts/deploy/sync-wrangler-config.ts
        env:
          PULUMI_STACK: ${{ steps.pulumi-select.outputs.stack_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BASE_DOMAIN: ${{ steps.deploy_resources.outputs.base_domain }}
          RESOURCE_PREFIX: ${{ steps.deploy_resources.outputs.prefix }}
          VM_AGENT_REQUIRED_VERSION: ${{ steps.deploy-sha.outputs.agent_version }}
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL }}
          CRON_SWEEPS_ENABLED_KV_KEY: ${{ vars.CRON_SWEEPS_ENABLED_KV_KEY }}
          DO_ALARMS_ENABLED_KV_KEY: ${{ vars.DO_ALARMS_ENABLED_KV_KEY }}
          CONTROL_LOOP_KILL_SWITCH_CACHE_MS: ${{ vars.CONTROL_LOOP_KILL_SWITCH_CACHE_MS }}
          CONTROL_LOOP_DISABLED_ALARM_RETRY_MS: ${{ vars.CONTROL_LOOP_DISABLED_ALARM_RETRY_MS }}
