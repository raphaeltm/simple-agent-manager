          PLATFORM_FEEDBACK_INCIDENT_MAX_AGE_MS: ${{ vars.PLATFORM_FEEDBACK_INCIDENT_MAX_AGE_MS }}
          PLATFORM_FEEDBACK_INCIDENT_TRIGGER_LIMIT: ${{ vars.PLATFORM_FEEDBACK_INCIDENT_TRIGGER_LIMIT }}
          PLATFORM_FEEDBACK_INCIDENT_SUMMARY_LIMIT: ${{ vars.PLATFORM_FEEDBACK_INCIDENT_SUMMARY_LIMIT }}
          PLATFORM_FEEDBACK_INCIDENT_EVIDENCE_REF_LIMIT: ${{ vars.PLATFORM_FEEDBACK_INCIDENT_EVIDENCE_REF_LIMIT }}
          PLATFORM_FEEDBACK_INCIDENT_EVIDENCE_MAX_BYTES: ${{ vars.PLATFORM_FEEDBACK_INCIDENT_EVIDENCE_MAX_BYTES }}
          PLATFORM_FEEDBACK_INCIDENT_RESOLUTION_NOTE_MAX_LENGTH: ${{ vars.PLATFORM_FEEDBACK_INCIDENT_RESOLUTION_NOTE_MAX_LENGTH }}
