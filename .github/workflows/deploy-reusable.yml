name: Deploy (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'GitHub Environment name (e.g. production, staging)'
      skip_agent:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: false
      target_commit_sha:
        required: false
        type: string
        default: ''

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.26.6'

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      config_valid: ${{ steps.check.outputs.valid }}
    steps:
      - name: Check Required Configuration
        id: check
        env:
          HAS_BASE_DOMAIN: ${{ vars.BASE_DOMAIN != '' }}
          HAS_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
          HAS_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID != '' }}
          HAS_CF_ZONE_ID: ${{ secrets.CF_ZONE_ID != '' }}
          HAS_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAS_PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE != '' }}
          HAS_GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID != '' }}
          HAS_GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET != '' }}
          HAS_GH_APP_ID: ${{ secrets.GH_APP_ID != '' }}
          HAS_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY != '' }}
          HAS_GH_APP_SLUG: ${{ secrets.GH_APP_SLUG != '' }}
          HAS_GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET != '' }}
          HAS_CF_ORIGIN_CA_KEY: ${{ secrets.CF_ORIGIN_CA_KEY != '' }}
          HAS_DEPLOY_SIGNING_PRIVATE_KEY: ${{ secrets.DEPLOY_SIGNING_PRIVATE_KEY != '' }}
          HAS_DEPLOY_SIGNING_PUBLIC_KEY: ${{ secrets.DEPLOY_SIGNING_PUBLIC_KEY != '' }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          MISSING=""

          if [ "$HAS_BASE_DOMAIN" != "true" ]; then
            MISSING="$MISSING\n  - vars.BASE_DOMAIN"
          fi
          if [ "$HAS_CF_API_TOKEN" != "true" ]; then
            MISSING="$MISSING\n  - secrets.CF_API_TOKEN"
          fi
          if [ "$HAS_CF_ACCOUNT_ID" != "true" ]; then
            MISSING="$MISSING\n  - secrets.CF_ACCOUNT_ID"
          fi
          if [ "$HAS_CF_ZONE_ID" != "true" ]; then
            MISSING="$MISSING\n  - secrets.CF_ZONE_ID"
          fi
          if [ "$HAS_R2_ACCESS_KEY_ID" != "true" ]; then
            MISSING="$MISSING\n  - secrets.R2_ACCESS_KEY_ID"
          fi
          if [ "$HAS_R2_SECRET_ACCESS_KEY" != "true" ]; then
            MISSING="$MISSING\n  - secrets.R2_SECRET_ACCESS_KEY"
          fi
          if [ "$HAS_PULUMI_CONFIG_PASSPHRASE" != "true" ]; then
            MISSING="$MISSING\n  - secrets.PULUMI_CONFIG_PASSPHRASE"
          fi
          if [ "$HAS_GH_CLIENT_ID" != "true" ] || [ "$HAS_GH_CLIENT_SECRET" != "true" ] || [ "$HAS_GH_APP_ID" != "true" ] || [ "$HAS_GH_APP_PRIVATE_KEY" != "true" ] || [ "$HAS_GH_APP_SLUG" != "true" ] || [ "$HAS_GH_WEBHOOK_SECRET" != "true" ]; then
            echo "::notice::GitHub App/OAuth secrets are incomplete — deploy will continue and admins can configure integrations through /setup or the superadmin platform config UI."
          fi
          if [ "$HAS_CF_ORIGIN_CA_KEY" != "true" ]; then
            echo "::notice::CF_ORIGIN_CA_KEY not set — using CF_API_TOKEN for Origin CA certs. If Pulumi fails with error 1016, ensure your API token has Zone > SSL and Certificates > Edit permission."
          fi
          if [[ "$HAS_DEPLOY_SIGNING_PRIVATE_KEY" != "true" ]]; then
            echo "::notice::DEPLOY_SIGNING_PRIVATE_KEY not set — using Pulumi-managed deploy signing key generated during deployment."
          elif [[ "$HAS_DEPLOY_SIGNING_PUBLIC_KEY" != "true" ]]; then
            echo "::notice::DEPLOY_SIGNING_PUBLIC_KEY not set — deriving it from DEPLOY_SIGNING_PRIVATE_KEY during Worker secret configuration."
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required configuration in GitHub Environment '$INPUT_ENVIRONMENT':$MISSING"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Missing Configuration" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following configuration is required in the GitHub Environment '$INPUT_ENVIRONMENT':" >> $GITHUB_STEP_SUMMARY
            echo -e "$MISSING" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Setup Instructions" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to **Settings > Environments > $INPUT_ENVIRONMENT**" >> $GITHUB_STEP_SUMMARY
            echo "2. Add the missing variables and secrets" >> $GITHUB_STEP_SUMMARY
            echo "3. Re-run this workflow" >> $GITHUB_STEP_SUMMARY
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "All required configuration present"
          echo "valid=true" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}
    env:
      # Pulumi 3.256.0 regressed custom-endpoint S3 writes by sending
      # UNSIGNED-PAYLOAD as a checksum. R2 accepts the SDK's supported checksum
      # path; keep this explicit until pulumi/pulumi#24219 is fixed upstream.
      AWS_REQUEST_CHECKSUM_CALCULATION: 'when_supported'
    outputs:
      api_url: ${{ steps.output.outputs.api_url }}
      app_url: ${{ steps.output.outputs.app_url }}

    steps:
      # ========================================
      # Phase 0: Setup
      # ========================================
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit_sha || github.sha }}

      - name: Resolve and Verify Deployment SHA
        id: deploy-sha
        env:
          EXPECTED_DEPLOY_SHA: ${{ inputs.target_commit_sha || github.sha }}
          SKIP_AGENT: ${{ inputs.skip_agent }}
        run: |
          ACTUAL_DEPLOY_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_DEPLOY_SHA" != "$EXPECTED_DEPLOY_SHA" ]; then
            echo "::error::Checked out SHA $ACTUAL_DEPLOY_SHA does not match verified deployment SHA $EXPECTED_DEPLOY_SHA"
            exit 1
          fi
          echo "value=$ACTUAL_DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          if [ "$SKIP_AGENT" = "true" ]; then
            echo "agent_version=" >> "$GITHUB_OUTPUT"
          else
            echo "agent_version=$ACTUAL_DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Validate Deployment Resource Names
        id: deploy_resources
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          PULUMI_STATE_BUCKET: ${{ vars.PULUMI_STATE_BUCKET }}
        run: node scripts/deploy/workflow-resource-names.mjs deploy

      # ========================================
      # Phase 1: Infrastructure (Pulumi)
      # ========================================
      - name: Create Pulumi State Bucket (if not exists)
        run: |
          BUCKET_NAME="$PULUMI_STATE_BUCKET"

          set +e
          OUTPUT=$(pnpm --filter @simple-agent-manager/api exec wrangler r2 bucket create "$BUCKET_NAME" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            echo "Created R2 bucket: $BUCKET_NAME"
          elif echo "$OUTPUT" | grep -Eq 'already exists, and you own it|\[code: 10004\]'; then
            echo "R2 bucket already exists: $BUCKET_NAME"
          else
            echo "::error title=Pulumi state bucket setup failed::Failed to create or verify R2 bucket '$BUCKET_NAME'. Check CF_API_TOKEN, CF_ACCOUNT_ID, and bucket permissions for the '$DEPLOY_ENVIRONMENT' GitHub environment."
            exit "$STATUS"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DEPLOY_ENVIRONMENT: ${{ steps.deploy_resources.outputs.environment }}
          PULUMI_STATE_BUCKET: ${{ steps.deploy_resources.outputs.pulumi_state_bucket }}

      - name: Validate Pulumi R2 Backend Access
        run: |
          BUCKET_NAME="$PULUMI_STATE_BUCKET"
          R2_ENDPOINT="${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"

          CHECK_SCRIPT="apps/api/.pulumi-r2-preflight.mjs"
          trap 'rm -f "$CHECK_SCRIPT"' EXIT
          cat > "$CHECK_SCRIPT" <<'JS'
          import { HeadObjectCommand, S3Client } from "@aws-sdk/client-s3";

          const bucket = process.env.BUCKET_NAME;
          const endpoint = process.env.R2_ENDPOINT;
          const accessKeyId = process.env.AWS_ACCESS_KEY_ID;
          const secretAccessKey = process.env.AWS_SECRET_ACCESS_KEY;

          if (!bucket || !endpoint || !accessKeyId || !secretAccessKey) {
            throw new Error("Missing required Pulumi R2 backend preflight environment");
          }

          const client = new S3Client({
            region: "auto",
            endpoint: `https://${endpoint}`,
            forcePathStyle: true,
            credentials: { accessKeyId, secretAccessKey },
          });

          try {
            await client.send(new HeadObjectCommand({ Bucket: bucket, Key: ".pulumi/meta.yaml" }));
            console.log(`Pulumi R2 backend read check succeeded for bucket: ${bucket}`);
          } catch (error) {
            const details = error;
            const status = details.$metadata?.httpStatusCode;
            const code = details.name || details.Code || "Unknown";

            if (status === 404 || code === "NotFound" || code === "NoSuchKey") {
              console.log("Pulumi metadata object is not present yet; continuing so Pulumi can initialize the backend.");
              process.exit(0);
            }

            if (status === 403 || code === "AccessDenied") {
              console.error(`PULUMI_R2_ACCESS_DENIED status=${status ?? "unknown"} code=${code}`);
              process.exit(13);
            }

            console.error(`PULUMI_R2_PREFLIGHT_FAILED status=${status ?? "unknown"} code=${code}`);
            process.exit(1);
          }
          JS

          set +e
          OUTPUT=$(BUCKET_NAME="$BUCKET_NAME" R2_ENDPOINT="$R2_ENDPOINT" node "$CHECK_SCRIPT" 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "$OUTPUT"
          elif [ "$STATUS" -eq 13 ]; then
            echo "::error title=Pulumi R2 backend access denied::R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY cannot read .pulumi/meta.yaml from bucket '$BUCKET_NAME'. Rotate these secrets for the '$DEPLOY_ENVIRONMENT' GitHub environment with an R2 API token scoped to this bucket in the same Cloudflare account as CF_ACCOUNT_ID."
            {
              echo "## Pulumi R2 Backend Access Denied"
              echo ""
              echo "The Cloudflare API token could verify the state bucket, but the R2 S3 credentials could not read \`.pulumi/meta.yaml\`."
              echo ""
              echo "Rotate the GitHub Environment '$DEPLOY_ENVIRONMENT' secrets:"
              echo "- \`R2_ACCESS_KEY_ID\`"
              echo "- \`R2_SECRET_ACCESS_KEY\`"
              echo ""
              echo "The replacement R2 API token must be created in the same Cloudflare account as \`CF_ACCOUNT_ID\`, scoped to bucket \`${BUCKET_NAME}\`, and allow object read/write access. Then re-run the deploy workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "$OUTPUT"
            echo "::error title=Pulumi R2 backend preflight failed::Unexpected failure while checking R2 S3 access for bucket '$BUCKET_NAME'."
            exit "$STATUS"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DEPLOY_ENVIRONMENT: ${{ steps.deploy_resources.outputs.environment }}
          PULUMI_STATE_BUCKET: ${{ steps.deploy_resources.outputs.pulumi_state_bucket }}

      - name: Login to Pulumi R2 Backend
        run: |
          BUCKET_NAME="$PULUMI_STATE_BUCKET"
          R2_ENDPOINT="${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Pulumi >=3.244 (AWS SDK v2) requires an explicit URL scheme on the S3 endpoint;
          # a scheme-less endpoint fails with 'unsupported protocol scheme ""'.
          pulumi login "s3://${BUCKET_NAME}?endpoint=https://${R2_ENDPOINT}&region=auto"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PULUMI_STATE_BUCKET: ${{ steps.deploy_resources.outputs.pulumi_state_bucket }}

      - name: Select or Create Pulumi Stack
        id: pulumi-select
        working-directory: infra
        run: |
          echo "stack_name=$STACK_NAME" >> "$GITHUB_OUTPUT"
          pulumi stack select "$STACK_NAME" 2>/dev/null || pulumi stack init "$STACK_NAME"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          STACK_NAME: ${{ steps.deploy_resources.outputs.stack }}

      - name: Set Pulumi Configuration
        working-directory: infra
        run: |
          pulumi config set cloudflareAccountId "$CF_ACCOUNT_ID"
          pulumi config set cloudflareZoneId "$CF_ZONE_ID"
          pulumi config set baseDomain "$BASE_DOMAIN"
          pulumi config set resourcePrefix "$RESOURCE_PREFIX"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BASE_DOMAIN: ${{ steps.deploy_resources.outputs.base_domain }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
          PREVIEW_URL_TTL_SECONDS: ${{ vars.PREVIEW_URL_TTL_SECONDS }}
          RESOURCE_PREFIX: ${{ steps.deploy_resources.outputs.prefix }}

      - name: Pulumi Preview
        if: ${{ inputs.dry_run == true }}
        working-directory: infra
        run: pulumi preview --diff
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_USER_SERVICE_KEY: ${{ secrets.CF_ORIGIN_CA_KEY }}

      - name: Pulumi Refresh
        if: ${{ inputs.dry_run != true }}
        working-directory: infra
        run: bash ../scripts/deploy/pulumi-refresh-safe.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_USER_SERVICE_KEY: ${{ secrets.CF_ORIGIN_CA_KEY }}
          PULUMI_REFRESH_MAX_ATTEMPTS: ${{ vars.PULUMI_REFRESH_MAX_ATTEMPTS }}
          PULUMI_REFRESH_RETRY_DELAY_SECONDS: ${{ vars.PULUMI_REFRESH_RETRY_DELAY_SECONDS }}
          PULUMI_REFRESH_DIAGNOSTIC_TAIL_LINES: ${{ vars.PULUMI_REFRESH_DIAGNOSTIC_TAIL_LINES }}

      - name: Pulumi Up
        if: ${{ inputs.dry_run != true }}
        working-directory: infra
        run: pulumi up --yes --skip-preview
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_USER_SERVICE_KEY: ${{ secrets.CF_ORIGIN_CA_KEY }}

      # ========================================
      # Phase 2: Configuration
      # ========================================
      - name: Sync Wrangler Config (API + Tail Worker)
        if: ${{ inputs.dry_run != true }}
        run: pnpm tsx scripts/deploy/sync-wrangler-config.ts
        env:
          PULUMI_STACK: ${{ steps.pulumi-select.outputs.stack_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BASE_DOMAIN: ${{ steps.deploy_resources.outputs.base_domain }}
          RESOURCE_PREFIX: ${{ steps.deploy_resources.outputs.prefix }}
          VM_AGENT_REQUIRED_VERSION: ${{ steps.deploy-sha.outputs.agent_version }}
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL }}
          CRON_SWEEPS_ENABLED_KV_KEY: ${{ vars.CRON_SWEEPS_ENABLED_KV_KEY }}
          DO_ALARMS_ENABLED_KV_KEY: ${{ vars.DO_ALARMS_ENABLED_KV_KEY }}
          CONTROL_LOOP_KILL_SWITCH_CACHE_MS: ${{ vars.CONTROL_LOOP_KILL_SWITCH_CACHE_MS }}
          CONTROL_LOOP_DISABLED_ALARM_RETRY_MS: ${{ vars.CONTROL_LOOP_DISABLED_ALARM_RETRY_MS }}
          CRON_FAILURE_NOTIFICATION_THROTTLE_MS: ${{ vars.CRON_FAILURE_NOTIFICATION_THROTTLE_MS }}
          CRON_FAILURE_NOTIFICATION_KV_PREFIX: ${{ vars.CRON_FAILURE_NOTIFICATION_KV_PREFIX }}
          NODE_LIFECYCLE_MAX_DESTROYING_AGE_MS: ${{ vars.NODE_LIFECYCLE_MAX_DESTROYING_AGE_MS }}
          NODE_CLEANUP_FAILURE_BACKOFF_MS: ${{ vars.NODE_CLEANUP_FAILURE_BACKOFF_MS }}
          DIAGNOSIS_COMPLETED_STEP_MIN_DELAY_MS: ${{ vars.DIAGNOSIS_COMPLETED_STEP_MIN_DELAY_MS }}
          ORCHESTRATOR_ZERO_TASK_GRACE_MS: ${{ vars.ORCHESTRATOR_ZERO_TASK_GRACE_MS }}
          ORCHESTRATOR_MAX_MISSION_LIFETIME_MS: ${{ vars.ORCHESTRATOR_MAX_MISSION_LIFETIME_MS }}
          ORCHESTRATOR_WAIT_RECONCILE_INTERVAL_MS: ${{ vars.ORCHESTRATOR_WAIT_RECONCILE_INTERVAL_MS }}
          ORCHESTRATOR_WAIT_MAX_CHILDREN: ${{ vars.ORCHESTRATOR_WAIT_MAX_CHILDREN }}
          ORCHESTRATOR_WAIT_MAX_ACTIVE_PER_PROJECT: ${{ vars.ORCHESTRATOR_WAIT_MAX_ACTIVE_PER_PROJECT }}
          ORCHESTRATOR_WAIT_MAX_DURATION_MS: ${{ vars.ORCHESTRATOR_WAIT_MAX_DURATION_MS }}
          ORCHESTRATOR_WAIT_MAX_CANDIDATES_PER_ALARM: ${{ vars.ORCHESTRATOR_WAIT_MAX_CANDIDATES_PER_ALARM }}
          SETUP_FORCE: ${{ vars.SETUP_FORCE }}
          HETZNER_BASE_IMAGE: ${{ vars.HETZNER_BASE_IMAGE }}
          DEPLOYMENT_RELEASE_RETENTION_ENABLED: ${{ vars.DEPLOYMENT_RELEASE_RETENTION_ENABLED }}
          DEPLOYMENT_RELEASE_RETENTION_COUNT: ${{ vars.DEPLOYMENT_RELEASE_RETENTION_COUNT }}
          DEPLOYMENT_RELEASE_RETENTION_BATCH_SIZE: ${{ vars.DEPLOYMENT_RELEASE_RETENTION_BATCH_SIZE }}
          DEPLOYMENT_RELEASE_RETENTION_INTERVAL_HOURS: ${{ vars.DEPLOYMENT_RELEASE_RETENTION_INTERVAL_HOURS }}
          DEPLOYMENT_RELEASE_RETENTION_LAST_RUN_KV_KEY: ${{ vars.DEPLOYMENT_RELEASE_RETENTION_LAST_RUN_KV_KEY }}
          DEPLOYMENT_RELEASE_RECONCILIATION_ENABLED: ${{ vars.DEPLOYMENT_RELEASE_RECONCILIATION_ENABLED }}
          DEPLOYMENT_RELEASE_RECONCILIATION_BATCH_SIZE: ${{ vars.DEPLOYMENT_RELEASE_RECONCILIATION_BATCH_SIZE }}
          DEPLOYMENT_RELEASE_RECONCILIATION_STALE_HOURS: ${{ vars.DEPLOYMENT_RELEASE_RECONCILIATION_STALE_HOURS }}
          DEPLOYMENT_RELEASE_RECONCILIATION_ACTIVITY_GRACE_HOURS: ${{ vars.DEPLOYMENT_RELEASE_RECONCILIATION_ACTIVITY_GRACE_HOURS }}
          DEPLOYMENT_IMAGE_RESOLVE_REQUEST_TIMEOUT_MS: ${{ vars.DEPLOYMENT_IMAGE_RESOLVE_REQUEST_TIMEOUT_MS }}
          DEPLOYMENT_IMAGE_RESOLVE_TOTAL_TIMEOUT_MS: ${{ vars.DEPLOYMENT_IMAGE_RESOLVE_TOTAL_TIMEOUT_MS }}
          DEPLOYMENT_IMAGE_RESOLVE_MAX_FETCH_ATTEMPTS: ${{ vars.DEPLOYMENT_IMAGE_RESOLVE_MAX_FETCH_ATTEMPTS }}
          DEPLOYMENT_IMAGE_RESOLVE_MAX_REDIRECTS: ${{ vars.DEPLOYMENT_IMAGE_RESOLVE_MAX_REDIRECTS }}
          DEPLOYMENT_IMAGE_RESOLVE_TOKEN_RESPONSE_MAX_BYTES: ${{ vars.DEPLOYMENT_IMAGE_RESOLVE_TOKEN_RESPONSE_MAX_BYTES }}
          DEPLOYMENT_IMAGE_RESOLVE_MAX_CONCURRENT_FETCHES: ${{ vars.DEPLOYMENT_IMAGE_RESOLVE_MAX_CONCURRENT_FETCHES }}
          DEPLOYMENT_IMAGE_RESOLVE_MAX_SERVICES: ${{ vars.DEPLOYMENT_IMAGE_RESOLVE_MAX_SERVICES }}
          SESSION_SNAPSHOT_PURGE_ENABLED: ${{ vars.SESSION_SNAPSHOT_PURGE_ENABLED }}
          SESSION_SNAPSHOT_PURGE_BATCH_SIZE: ${{ vars.SESSION_SNAPSHOT_PURGE_BATCH_SIZE }}
          SESSION_SNAPSHOT_RECOVERY_MAX_ATTEMPTS: ${{ vars.SESSION_SNAPSHOT_RECOVERY_MAX_ATTEMPTS }}
          SESSION_SNAPSHOT_R2_PREFIX: ${{ vars.SESSION_SNAPSHOT_R2_PREFIX }}
          SESSION_SNAPSHOT_TOTAL_BUDGET_BYTES: ${{ vars.SESSION_SNAPSHOT_TOTAL_BUDGET_BYTES }}
          SESSION_SNAPSHOT_ENTRY_THRESHOLD_BYTES: ${{ vars.SESSION_SNAPSHOT_ENTRY_THRESHOLD_BYTES }}
          SESSION_SNAPSHOT_TRANSFER_IDLE_TIMEOUT_MS: ${{ vars.SESSION_SNAPSHOT_TRANSFER_IDLE_TIMEOUT_MS }}
          SESSION_SNAPSHOT_REQUEST_TIMEOUT_MS: ${{ vars.SESSION_SNAPSHOT_REQUEST_TIMEOUT_MS }}
          SESSION_SNAPSHOT_POLL_INTERVAL_MS: ${{ vars.SESSION_SNAPSHOT_POLL_INTERVAL_MS }}
          SESSION_SNAPSHOT_OPERATION_TIMEOUT: ${{ vars.SESSION_SNAPSHOT_OPERATION_TIMEOUT }}
          SESSION_SNAPSHOT_JSON_BODY_MAX_BYTES: ${{ vars.SESSION_SNAPSHOT_JSON_BODY_MAX_BYTES }}
          SESSION_SLEEP_AFTER_MS: ${{ vars.SESSION_SLEEP_AFTER_MS }}
          SESSION_SLEEP_SWEEP_BATCH_SIZE: ${{ vars.SESSION_SLEEP_SWEEP_BATCH_SIZE }}
          SESSION_SLEEP_SWEEP_WALL_BUDGET_MS: ${{ vars.SESSION_SLEEP_SWEEP_WALL_BUDGET_MS }}
          SESSION_SLEEP_RETRY_DELAY_MS: ${{ vars.SESSION_SLEEP_RETRY_DELAY_MS }}
          SESSION_SLEEP_MAX_ATTEMPTS: ${{ vars.SESSION_SLEEP_MAX_ATTEMPTS }}
          SESSION_SLEEP_CLAIM_LEASE_MS: ${{ vars.SESSION_SLEEP_CLAIM_LEASE_MS }}
          HARNESS_BACKGROUND_WORK_LEASE_MS: ${{ vars.HARNESS_BACKGROUND_WORK_LEASE_MS }}
          HARNESS_BACKGROUND_WORK_MAX_DURATION_MS: ${{ vars.HARNESS_BACKGROUND_WORK_MAX_DURATION_MS }}
          SESSION_SNAPSHOT_RECOVERY_CLAIM_LEASE_MS: ${{ vars.SESSION_SNAPSHOT_RECOVERY_CLAIM_LEASE_MS }}
          SESSION_LIFECYCLE_ERROR_MAX_LENGTH: ${{ vars.SESSION_LIFECYCLE_ERROR_MAX_LENGTH }}
