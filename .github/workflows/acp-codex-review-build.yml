name: PR 2246 SonarCloud Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Analyze exact PR 2246 head
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4e88c24d826c11344e134b3b3f0db163cc144c15
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze PR 2246 with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.pullrequest.key=2246
            -Dsonar.pullrequest.branch=sam/pr-2245-acp-marker-regression
            -Dsonar.pullrequest.base=main
            -Dsonar.scm.revision=4e88c24d826c11344e134b3b3f0db163cc144c15
            -Dsonar.qualitygate.wait=true
