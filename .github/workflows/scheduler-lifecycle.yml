name: Scheduler Lifecycle Exploration

on:
  schedule:
    - cron: '33 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  explore:
    name: Explore Scheduler Lifecycles
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build scheduler-core dependencies
        run: pnpm exec turbo run build --filter=@simple-agent-manager/scheduler-core^...

      - name: Explore generated scheduler lifecycles
        run: |
          set -o pipefail
          pnpm --filter @simple-agent-manager/scheduler-core test:scheduler:nightly 2>&1 | tee scheduler-lifecycle.log

      - name: Upload replay diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduler-lifecycle-replay-${{ github.run_id }}
          path: scheduler-lifecycle.log
          if-no-files-found: error
          retention-days: 14
