name: Scheduler Lifecycle Exploration

on:
  schedule:
    - cron: '33 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  explore:
    name: Explore Scheduler Lifecycles
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build API dependencies
        run: pnpm exec turbo run build --filter=@simple-agent-manager/api...

      - name: Explore generated scheduler lifecycles
        run: |
          set -o pipefail
          pnpm --filter @simple-agent-manager/api test:scheduler:nightly 2>&1 | tee scheduler-lifecycle.log

      - name: Upload replay diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduler-lifecycle-replay-${{ github.run_id }}
          path: scheduler-lifecycle.log
          if-no-files-found: error
          retention-days: 14
