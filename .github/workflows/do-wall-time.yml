name: Durable Object Wall-Time

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment supplying the target Cloudflare credentials
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      operation:
        description: Operation to run
        required: true
        default: wall-time
        type: choice
        options:
          - wall-time
          - stale-heartbeat-probe
      probe_database_id:
        description: Staging D1 database UUID for the bounded probe
        required: false
        type: string
      probe_node_id:
        description: Exact staging node ULID for the bounded probe
        required: false
        type: string
      probe_stale_timestamp:
        description: ISO timestamp to persist during the bounded probe
        required: false
        type: string
      probe_iterations:
        description: Number of bounded stale writes
        required: false
        type: string
      probe_interval_seconds:
        description: Seconds between bounded stale writes
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check DO Wall-Time
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Scheduled runs execute from main against production. Manual branch runs
    # select staging so branch-restricted production credentials remain protected.
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inject bounded staging stale-heartbeat evidence
        if: ${{ inputs.operation == 'stale-heartbeat-probe' }}
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          PROBE_DATABASE_ID: ${{ inputs.probe_database_id }}
          PROBE_NODE_ID: ${{ inputs.probe_node_id }}
          PROBE_STALE_TIMESTAMP: ${{ inputs.probe_stale_timestamp }}
          PROBE_ITERATIONS: ${{ inputs.probe_iterations }}
          PROBE_INTERVAL_SECONDS: ${{ inputs.probe_interval_seconds }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" != staging ]; then
            echo "Stale-heartbeat probes are staging-only" >&2
            exit 2
          fi
          [[ "$PROBE_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$PROBE_NODE_ID" =~ ^[0-9A-HJKMNP-TV-Z]{26}$ ]]
          [[ "$PROBE_STALE_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$ ]]
          [[ "$PROBE_ITERATIONS" =~ ^[0-9]+$ ]]
          [[ "$PROBE_INTERVAL_SECONDS" =~ ^[0-9]+$ ]]
          if [ "$PROBE_ITERATIONS" -lt 1 ] || [ "$PROBE_ITERATIONS" -gt 120 ]; then
            echo "Probe iterations must be in [1,120]" >&2
            exit 2
          fi
          if [ "$PROBE_INTERVAL_SECONDS" -lt 1 ] || [ "$PROBE_INTERVAL_SECONDS" -gt 10 ]; then
            echo "Probe interval must be in [1,10] seconds" >&2
            exit 2
          fi
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$PROBE_DATABASE_ID/query"
          query() {
            curl -fsS -X POST \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H 'Content-Type: application/json' \
              "$endpoint" --data "$1"
          }
          inventory_payload=$(jq -cn --arg node "$PROBE_NODE_ID" '{sql:"SELECT id,status,runtime FROM nodes WHERE id = ?",params:[$node]}')
          inventory=$(query "$inventory_payload")
          if [ "$(jq -r '.result[0].results | length' <<<"$inventory")" != 1 ] || \
             [ "$(jq -r '.result[0].results[0].status' <<<"$inventory")" != running ] || \
             [ "$(jq -r '.result[0].results[0].runtime' <<<"$inventory")" != vm ]; then
            echo "Exact running VM probe target was not found" >&2
            exit 2
          fi
          update_payload=$(jq -cn --arg node "$PROBE_NODE_ID" --arg stale "$PROBE_STALE_TIMESTAMP" '{sql:"UPDATE nodes SET health_status = ?, last_heartbeat_at = ? WHERE id = ? AND status = ? AND runtime = ?",params:["unhealthy",$stale,$node,"running","vm"]}')
          for ((i = 1; i <= PROBE_ITERATIONS; i++)); do
            result=$(query "$update_payload")
            if [ "$(jq -r '.result[0].meta.changes // 0' <<<"$result")" != 1 ]; then
              echo "Exact-node stale write failed at iteration $i" >&2
              exit 2
            fi
            sleep "$PROBE_INTERVAL_SECONDS"
          done
          echo "Completed $PROBE_ITERATIONS exact-node stale-heartbeat writes"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ inputs.operation != 'stale-heartbeat-probe' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.operation != 'stale-heartbeat-probe' }}
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ inputs.operation != 'stale-heartbeat-probe' }}
        run: pnpm install --frozen-lockfile

      - name: Check Durable Object wall-time regression
        if: ${{ inputs.operation != 'stale-heartbeat-probe' }}
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          DO_WALL_TIME_SCRIPT_NAMES: ${{ vars.DO_WALL_TIME_SCRIPT_NAMES }}
          DO_WALL_TIME_NAMESPACE_IDS: ${{ vars.DO_WALL_TIME_NAMESPACE_IDS }}
          DO_WALL_TIME_OBJECT_NAMES: ${{ vars.DO_WALL_TIME_OBJECT_NAMES }}
          DO_WALL_TIME_INVOCATION_TYPES: ${{ vars.DO_WALL_TIME_INVOCATION_TYPES }}
          DO_WALL_TIME_RECENT_HOURS: ${{ vars.DO_WALL_TIME_RECENT_HOURS }}
          DO_WALL_TIME_BASELINE_HOURS: ${{ vars.DO_WALL_TIME_BASELINE_HOURS }}
          DO_WALL_TIME_REGRESSION_RATIO: ${{ vars.DO_WALL_TIME_REGRESSION_RATIO }}
          DO_INVOCATION_RATE_REGRESSION_RATIO: ${{ vars.DO_INVOCATION_RATE_REGRESSION_RATIO }}
          DO_WALL_TIME_MIN_REQUESTS: ${{ vars.DO_WALL_TIME_MIN_REQUESTS }}
          DO_WALL_TIME_LIMIT: ${{ vars.DO_WALL_TIME_LIMIT }}
          DO_CRON_LIVENESS_MAX_AGE_HOURS: ${{ vars.DO_CRON_LIVENESS_MAX_AGE_HOURS }}
          # Must resolve to the target API Worker. The script falls back to
          # DO_WALL_TIME_SCRIPT_NAMES and fails closed if neither is configured.
          DO_CRON_LIVENESS_SCRIPT_NAMES: ${{ vars.DO_CRON_LIVENESS_SCRIPT_NAMES }}
          DO_CRON_LIVENESS_ENDPOINT: ${{ vars.DO_CRON_LIVENESS_ENDPOINT }}
        run: |
          set -o pipefail
          case "$TARGET_ENVIRONMENT" in
            production) TARGET_STACK="prod" ;;
            staging) TARGET_STACK="staging" ;;
            *) echo "Unsupported target environment: $TARGET_ENVIRONMENT" >&2; exit 2 ;;
          esac
          if [ -z "$RESOURCE_PREFIX" ]; then
            if [ -z "$BASE_DOMAIN" ]; then
              echo "RESOURCE_PREFIX or BASE_DOMAIN GitHub Environment variable is required" >&2
              exit 2
            fi
            # Derive from BASE_DOMAIN: 's' + first 6 hex chars of sha256.
            # Must match infra/resources/config.ts derivePrefix() and the
            # Compute Resource Prefix step in deploy-reusable.yml.
            RESOURCE_PREFIX="s$(printf %s "$BASE_DOMAIN" | sha256sum | cut -c1-6)"
            echo "Resource prefix (derived from $BASE_DOMAIN): $RESOURCE_PREFIX"
          fi
          if [ -z "$DO_WALL_TIME_SCRIPT_NAMES" ]; then
            export DO_WALL_TIME_SCRIPT_NAMES="${RESOURCE_PREFIX}-api-${TARGET_STACK}"
          fi
          if [ -z "$DO_CRON_LIVENESS_SCRIPT_NAMES" ]; then
            export DO_CRON_LIVENESS_SCRIPT_NAMES="$DO_WALL_TIME_SCRIPT_NAMES"
          fi
          pnpm quality:do-wall-time | tee do-wall-time-report.txt

      - name: Publish check summary
        if: always()
        run: |
          {
            echo "## Durable Object Wall-Time Check"
            echo
            if [ -f do-wall-time-report.txt ]; then
              echo '```'
              cat do-wall-time-report.txt
              echo '```'
            else
              echo "The check did not produce a report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
