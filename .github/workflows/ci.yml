name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Draft pull requests run only the quick checks (see `github.event.pull_request.draft`
    # in the job conditions). Marking a PR ready for review starts the full suite on the
    # same commit, so `ready_for_review` must trigger a run. `edited` and `labeled` are
    # deliberately absent: see scripts/quality/pr-evidence-source.ts.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  DEVCONTAINERS_CLI_VERSION: 0.80.2
  GITLEAKS_VERSION: 8.30.1
  GO_VERSION: '1.26.11'

permissions:
  contents: read

concurrency:
  # Pull requests share one group per PR and cancel superseded commits. Every other
  # event (main pushes, manual runs) gets one group per commit, so a second main merge
  # does not wait for the previous main run to finish. An older main run that finishes
  # late cannot deploy over a newer one: deploy.yml serializes production runs and
  # scripts/deploy/validate-production-dispatch.ts only deploys the current main tip.
  # GitHub keeps one pending deploy run, so an older run's deploy can replace the tip's
  # pending one; the gate then deploys the tip itself when the tip's CI is green, and
  # otherwise waits for the tip's own CI completion to trigger its deploy.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Keep main CI runs alive so every successful main merge can trigger production deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    # Fork bypass: on a push to main in a fork (self-host), skip the canonical
    # repo's full CI suite. Pull requests always run CI (any repo), and the
    # canonical repo always runs CI. Fork operators update their running SAM
    # instance by manually running Deploy Production on main; the workflow_run
    # production deploy path is for the canonical repository's successful CI.
    # Because every other job depends on `changes` (directly via `needs`, or
    # explicitly via this same guard), skipping `changes` cascades a skip across
    # the whole workflow.
    if: github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # The suite outputs (api, api-unit, web, public-site, packages) select test suites by
    # package dependency: a package's suite runs when it or anything it depends on changes.
    # scripts/quality/ci-suite-selection.test.ts derives the expected paths from every
    # package.json and fails when a filter misses a dependency. A main push runs every suite.
    outputs:
      api: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.api }}
      api-unit: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.api-unit }}
      web: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.web }}
      public-site: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.public-site }}
      packages: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.packages }}
      vm-agent: ${{ steps.filter.outputs.vm-agent }}
      cli: ${{ steps.filter.outputs.cli }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      devcontainer-volume-mount: ${{ steps.filter.outputs.devcontainer-volume-mount }}
      infra: ${{ steps.filter.outputs.infra }}
      deploy-scripts: ${{ steps.filter.outputs.deploy-scripts }}
      ci-workflow: ${{ steps.filter.outputs.ci-workflow }}
      repo-quality: ${{ steps.filter.outputs.repo-quality }}
      agent-instructions: ${{ steps.filter.outputs.agent-instructions }}
      web-ui: ${{ steps.filter.outputs.web-ui }}
      browser-install: ${{ steps.filter.outputs.browser-install }}
      go-modules: ${{ steps.filter.outputs.go-modules }}
      selfhost-email: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.selfhost-email }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Inputs every package's tests share.
            workspace-root: &workspace-root
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'vitest.coverage.ts'
            # apps/api and every package it depends on (Durable Object Workers suite).
            api: &api
              - *workspace-root
              - 'apps/api/**'
              - 'packages/agent-email/**'
              - 'packages/ai-proxy/**'
              - 'packages/app-deployment/**'
              - 'packages/cloud-init/**'
              - 'packages/cron/**'
              - 'packages/operations/**'
              - 'packages/project-data/**'
              - 'packages/providers/**'
              - 'packages/repo-hosting/**'
              - 'packages/scheduler-core/**'
              - 'packages/shared/**'
              - 'packages/worker-core/**'
              - 'scripts/quality/*migration*.ts'
              - 'scripts/quality/runtime-boundary*.ts'
              # Proved against the API read paths by tests/unit/config/omitted-worker-var-defaults.test.ts,
              # which also reads the GitHub Environment snapshot.
              - 'scripts/deploy/worker-var-defaults.ts'
              - 'scripts/quality/fixtures/github-environment-variables-*.json'
              - 'scripts/quality/fixtures/worker-var-binding-audit-*.json'
              # Cross-boundary fixtures shared with the VM agent and the web app.
              - 'tests/fixtures/diagnostic-secret-canaries.json'
              - 'tests/fixtures/provider-limit-rejections.json'
            # The API unit suite also reads or imports files outside its dependencies.
            # ci-suite-selection.test.ts scans the tests and their imports for these.
            api-unit:
              - *api
              # Go sources, Makefile and `go test` runs in cross-boundary contract tests.
              - 'packages/vm-agent/**'
              # Omitted-worker-var defaults scan the tail worker's sources.
              - 'apps/tail-worker/**'
              # Lineage and start-work tests import or read these web modules.
              - 'apps/web/src/components/ProjectAgentCard.tsx'
              - 'apps/web/src/components/ProjectAgentsSection.tsx'
              - 'apps/web/src/components/ideas/StartWorkSheet.tsx'
              - 'apps/web/src/components/ideas/useStartWork.ts'
              - 'apps/web/src/components/project-settings/ProjectSettingsAgentsTab.tsx'
              - 'apps/web/src/components/task-hierarchy/buildHierarchyTree.ts'
              - 'apps/web/src/lib/api/**'
              - 'apps/web/src/lib/runtime-validation.ts'
              - 'apps/web/src/lib/server-clock.ts'
              - 'apps/web/src/pages/project-chat/lineageUtils.ts'
              - 'apps/web/src/pages/project-chat/useTaskGroups.ts'
              - 'scripts/deploy/deploy-signing-keys.ts'
              # Imported by scripts/selfhost/celld-config.ts (below).
              - 'scripts/deploy/durable-object-migrations.ts'
              - 'scripts/deploy/types.ts'
              - 'scripts/deploy/vapid-keys.ts'
              # Self-host build tests import the celld generator, presign vars, SMTP settings and
              # account SQL: these modules plus the scripts/selfhost modules they import. The
              # transitive ones are listed by hand: ci-suite-selection.test.ts checks the direct
              # imports but does not follow `./x.js` specifiers to `x.ts`.
              - 'scripts/selfhost/account-sql.ts'
              - 'scripts/selfhost/box-settings.ts'
              - 'scripts/selfhost/celld-config.ts'
              - 'scripts/selfhost/celld-project.ts'
              - 'scripts/selfhost/mail-settings.ts'
              - 'scripts/selfhost/observability-migrations.ts'
              - 'scripts/selfhost/reverse-tunnel-migrations.ts'
              - 'scripts/selfhost/secret-files.ts'
              - 'scripts/selfhost/selfhost-migrations.ts'
              # selfhost-inbound-email.test.ts builds this receiver (Self-host Email job only).
              - 'deploy/selfhost/sam-mx/**'
              - 'scripts/quality/node-pool-boundary.ts'
              - 'scripts/quality/node-pool-boundary/**'
              - 'tests/fixtures/acp-activity-report-v1.json'
              - 'tests/fixtures/deploy-release/**'
              - 'tests/fixtures/durable-execution-protocol-v1.json'
              - 'tests/fixtures/session-snapshot-restore-transcript-only-v1.json'
            web:
              - *workspace-root
              - 'apps/web/**'
              - 'packages/acp-client/**'
              - 'packages/shared/**'
              - 'packages/terminal/**'
              - 'packages/ui/**'
              - 'tests/fixtures/diagnostic-secret-canaries.json'
            # Storybook (packages/ui) and the public site (apps/www, which depends on ui).
            public-site:
              - *workspace-root
              - 'apps/www/**'
              - 'packages/ui/**'
              - '.github/workflows/deploy-www.yml'
              - 'scripts/quality/check-astro-templates.ts'
              - 'scripts/quality/check-browser-evidence.ts'
              - 'scripts/quality/check-workspace-test-surfaces.ts'
            # Every workspace package whose tests `Test other packages` runs (all but api and
            # web). A shared package also triggers api, web or public-site above.
            packages:
              - *workspace-root
              - 'apps/installer/**'
              - 'apps/tail-worker/**'
              - 'apps/www/**'
              - 'infra/**'
              - 'packages/acp-client/**'
              - 'packages/agent-email/**'
              - 'packages/ai-proxy/**'
              - 'packages/app-deployment/**'
              - 'packages/cloud-init/**'
              - 'packages/cron/**'
              - 'packages/eslint-plugin-sam/**'
              - 'packages/operations/**'
              - 'packages/project-data/**'
              - 'packages/providers/**'
              - 'packages/repo-hosting/**'
              - 'packages/scheduler-core/**'
              - 'packages/shared/**'
              - 'packages/terminal/**'
              - 'packages/ui/**'
              - 'packages/worker-core/**'
              # apps/installer reads the installer protocol and source cache.
              - 'scripts/deploy/installer-*'
              # The www integrations catalog test checks the app's agent sign-in matrix.
              - 'apps/web/src/components/AgentSettingsCard.tsx'
            vm-agent:
              - 'packages/vm-agent/**'
              # Shared with the Worker tests; a fixture-only edit must run the Go half too.
              - 'tests/fixtures/session-snapshot-restore-transcript-only-v1.json'
              - 'apps/api/Dockerfile.vm-agent-container'
              - 'scripts/ci/verify-codex-runtime-image.sh'
              - 'scripts/deploy/prepare-codex-runtime-artifact.sh'
            cli:
              - 'packages/cli/**'
              - 'packages/vm-agent/internal/config/**'
              - 'apps/api/src/**'
              - 'packages/shared/src/**'
              - 'packages/worker-core/src/**'
              - 'packages/app-deployment/src/**'
              - 'packages/project-data/src/**'
              - 'packages/repo-hosting/src/**'
              - 'packages/scheduler-core/src/**'
              - 'packages/agent-email/src/**'
              - 'packages/operations/src/**'
              - 'packages/ai-proxy/src/**'
              - 'packages/cron/src/**'
              - 'sonar-project.properties'
              - '.claude/rules/36-cli-quality.md'
            devcontainer:
              - '.devcontainer/**'
            devcontainer-volume-mount:
              - '.devcontainer/**'
              - 'scripts/ci/**'
              - 'packages/vm-agent/**'
              - 'packages/cloud-init/**'
            infra:
              - 'infra/**'
            deploy-scripts:
              - 'package.json'
              - 'turbo.json'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
              - 'packages/vm-agent/Makefile'
              # scripts/selfhost/vm-agent-artifacts.test.ts pins the Go build image to its go directive.
              - 'packages/vm-agent/go.mod'
              - 'packages/cli/Makefile'
              - 'apps/installer/scripts/**'
              - 'apps/www/scripts/build-tracker.ts'
              - 'apps/api/Dockerfile.sandbox'
              - 'apps/api/Dockerfile.vm-agent-container'
              - 'apps/api/scripts/**'
              - 'apps/api/container-entrypoints/**'
              - 'scripts/deploy/**'
              # Self-hosted (celld) packaging: config generator, deploy, upgrade, create-account.
              - 'scripts/selfhost/**'
              # ...and what its tests read outside it: the self-host migration projection and the
              # SMTP settings parser.
              - 'apps/api/src/selfhost/**'
              - 'packages/agent-email/src/smtp-config.ts'
              # The generated Worker config is built from wrangler.toml, so its text-binding
              # guard and effective-config tests must run when only wrangler.toml changes.
              - 'apps/api/wrangler.toml'
              - 'scripts/quality/deploy*.test.ts'
              - 'scripts/quality/sync-wrangler-config.test.ts'
              - 'scripts/quality/fixtures/github-environment-variables-*.json'
              - 'scripts/quality/fixtures/worker-var-binding-audit-*.json'
              - 'scripts/quality/do-migration-compatibility.test.ts'
              - '.github/workflows/deploy*.yml'
              - '.github/workflows/provision*.yml'
              - '.github/workflows/teardown*.yml'
            ci-workflow:
              - '.github/workflows/ci.yml'
              - '.github/workflows/codspeed.yml'
              - '.github/workflows/deploy-installer.yml'
              - 'scripts/quality/ci*.test.ts'
              - 'scripts/ci/run-with-apt-mirror-fallback.sh'
            repo-quality:
              - 'scripts/quality/check-runtime-tunables*'
              - 'scripts/quality/runtime-tunables-baseline.json'
              - 'apps/api/**'
              - 'apps/web/**'
              - 'infra/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              - 'eslint.config.*'
              - 'prettier.config.*'
            # Files that decide what an agent harness loads. See
            # scripts/quality/check-agent-context-budget.ts.
            agent-instructions:
              - '.claude/rules/**'
              - '.claude/settings.json'
              - '.claude/hooks/**'
              - '.codex/**'
              - 'CLAUDE.md'
              - 'AGENTS.md'
              - '**/AGENTS.md'
              - 'AGENTS.override.md'
              - '**/AGENTS.override.md'
              - 'scripts/quality/agent-*'
              - 'scripts/quality/check-agent-context-budget.ts'
              - 'scripts/quality/go-optional-fields/**'
            web-ui:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/terminal/**'
              - 'packages/acp-client/**'
            # The helper every browser job installs Chromium through. A change to it
            # must run those jobs, or it is never exercised against a real runner.
            browser-install:
              - 'scripts/ci/run-with-apt-mirror-fallback.sh'
            go-modules:
              - '**/go.mod'
              - '**/go.sum'
              - 'scripts/quality/check-go-vulnerability-diff.ts'
            # Self-host email: the sam-mx receiver and the SMTP path (landing plan F12, D9).
            # Deliberately not packages/cloud-init: the VM path does not reach this code.
            selfhost-email:
              - 'deploy/selfhost/sam-mx/**'
              - 'packages/agent-email/**'
              - 'apps/api/src/selfhost/**'
              - 'apps/api/src/services/agent-email/**'
              - 'apps/api/src/services/email-sign-in.ts'
              - 'apps/api/src/services/security-alerts.ts'
              - 'apps/api/src/routes/account-linking.ts'
              - 'apps/api/src/routes/admin-agent-email.ts'
              - 'apps/api/src/routes/auth.ts'
              - 'apps/api/src/routes/setup.ts'
              - 'apps/api/src/env.ts'
              - 'apps/api/tests/unit/routes/setup-email.test.ts'
              - 'apps/api/tests/integration/github-link-social.test.ts'
              - 'apps/api/tests/helpers/fake-smtp-server.ts'
              - 'apps/api/tests/mocks/cloudflare-sockets.ts'
              - 'apps/api/tests/integration/selfhost-inbound-email.test.ts'
              - 'apps/api/tests/integration/email-sign-in-smtp.test.ts'
              - 'apps/api/tests/workers/smtp-client-workerd.test.ts'
              - 'apps/api/tests/workers/support/smtp-native-entry.ts'
              - '.github/workflows/selfhost-email-tests.yml'

  # One job for the PR-body and PR-content checks. They used to be three jobs that each
  # spent a runner slot on checkout and install for a few seconds of work. Each check
  # still runs when an earlier one fails, so a single run reports every evidence gap.
  pr-evidence:
    name: PR Evidence
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # `pull-requests: read` + GITHUB_TOKEN let the checks read the PR's CURRENT
    # body/labels instead of the frozen event payload. Job-level `permissions`
    # REPLACES the top-level block, so `contents: read` must be restated for
    # actions/checkout. Without both of these the checks silently degrade to the
    # stale payload — see scripts/quality/ci-evidence-token-wiring.test.ts.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Preflight evidence documents an agent's pre-implementation research. Dependabot
      # opens PRs from a fixed template and cannot produce that evidence, so the check
      # is unsatisfiable for it and leaves the whole dependency lane permanently red.
      # The stale-binary guard below still runs for every author.
      #
      # Both identities are required. `user.login` is frozen when the PR is opened, and
      # dependabot branches live in this repo rather than a fork, so anyone with push
      # access can add a commit to an open dependabot/** branch without changing it.
      # `github.actor` is the actor of THIS event, so a human push flips it back and the
      # evidence check runs again. Skip only when both say dependabot.
      - name: Validate agent preflight evidence
        if: >-
          github.actor != 'dependabot[bot]' ||
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: pnpm quality:preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate no stale binary artifacts are tracked
        if: ${{ !cancelled() }}
        run: pnpm quality:no-tracked-stale-binaries

      - name: Validate specialist review evidence
        if: ${{ !cancelled() }}
        run: pnpm quality:specialist-review
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate UI checklist evidence
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-ui-compliance.mjs

  lint:
    name: Lint
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && needs.changes.outputs.repo-quality == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run Oxlint shadow
        run: pnpm lint:oxlint

      - name: Run ESLint authoritative layer
        run: pnpm lint

      - name: Enforce type-boundary ratchet
        run: pnpm quality:type-boundaries

      - name: Keep runtime workflow state out of commits
        run: pnpm quality:runtime-state-files

      - name: Run SAM RuleTester fixtures
        run: pnpm --filter @simple-agent-manager/eslint-plugin-sam test

      - name: Shadow SAM fixtures through Oxlint alpha host
        continue-on-error: true
        run: pnpm lint:oxlint:sam-shadow

  secret-scan:
    name: Secret Scan
    if: github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Policy 795e72a6 / rule 83: no Pulumi secret readback, credential decryption, shell
      # tracing or environment dumps in workflow, deploy, infra or CI-script code. Here, not in a
      # path-filtered job, so every PR runs it whatever it touches. Blocking from the start: zero
      # findings outside real instances in 25 sampled commits since June 2026
      # (scripts/quality/README.md).
      - name: No secret readback in CI code (policy 795e72a6)
        run: pnpm quality:no-secret-readback

      - name: Install verified Gitleaks release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          gh release download "v${GITLEAKS_VERSION}" \
            --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing --check "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

      - name: Scan current tree
        env:
          SAM_GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: pnpm quality:gitleaks:current

      - name: Scan pull request commit range
        if: github.event_name == 'pull_request'
        env:
          SAM_GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: pnpm quality:gitleaks:pr

  # Quick check (also runs on draft PRs). `pnpm build` is this job's first step, so a
  # separate Build job would only repeat it on another runner.
  typecheck:
    name: Build and Type Check
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && needs.changes.outputs.repo-quality == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

  # The unit suites run in shards. One job used to run every package and took 20 to
  # 30 min (apps/api alone ~23 min, apps/web ~11 min). Each shard writes a Vitest blob
  # report that carries its coverage. A shard sees only part of its package, so its
  # coverage thresholds are zeroed here; the `test` job merges the blobs and enforces
  # the thresholds from the package's vitest.config.ts over the whole package.
  # Shard counts are repeated in the matrix, the --shard flag and the `test` job's
  # blob-count check; scripts/quality/ci-test-shards.test.ts keeps them in step.
  test-api:
    name: Test api (${{ matrix.shard }}/3)
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft && needs.changes.outputs.api-unit == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API dependencies
        run: pnpm exec turbo run build --filter=@simple-agent-manager/api^...

      - name: Run API unit test shard with coverage
        working-directory: apps/api
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: >-
          pnpm exec vitest run --shard="${TEST_SHARD}/3"
          --reporter=blob --reporter=default
          --coverage --coverage.reporter=text-summary
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - name: Upload API blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-blob-api-${{ matrix.shard }}
          path: apps/api/.vitest-reports/
          # The blob directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-web:
    name: Test web (${{ matrix.shard }}/2)
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft && needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web dependencies
        run: pnpm exec turbo run build --filter=@simple-agent-manager/web^...

      - name: Run web unit test shard with coverage
        working-directory: apps/web
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: >-
          pnpm exec vitest run --shard="${TEST_SHARD}/2"
          --reporter=blob --reporter=default
          --coverage --coverage.reporter=text-summary
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - name: Upload web blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-blob-web-${{ matrix.shard }}
          path: apps/web/.vitest-reports/
          # The blob directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Every other package is small (about 3 min together) and enforces its own
  # thresholds in its own unsharded run. turbo builds what each package needs.
  test-packages:
    name: Test other packages
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft && needs.changes.outputs.packages == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests with coverage
        run: |
          node -e "console.log('Available test CPUs:', require('node:os').availableParallelism())"
          pnpm test:coverage --filter='!@simple-agent-manager/api' --filter='!@simple-agent-manager/web' --concurrency=2 -- --maxWorkers=75%

  # Keeps the `Test` check name. Fails unless every selected shard passed, then enforces
  # the coverage thresholds on the merged API and web reports. A suite that was not
  # selected for this change must be skipped, never failed or cancelled. `!cancelled()`
  # runs it after a failed shard (so the failure is reported here) but not in a cancelled run.
  test:
    name: Test
    needs: [changes, test-api, test-web, test-packages]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft && (needs.changes.outputs.api-unit == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true') }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected test shard to pass
        env:
          API_SELECTED: ${{ needs.changes.outputs.api-unit }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          PACKAGES_SELECTED: ${{ needs.changes.outputs.packages }}
          API_RESULT: ${{ needs.test-api.result }}
          WEB_RESULT: ${{ needs.test-web.result }}
          PACKAGES_RESULT: ${{ needs.test-packages.result }}
        run: |
          echo "test-api=$API_RESULT ($API_SELECTED) test-web=$WEB_RESULT ($WEB_SELECTED) test-packages=$PACKAGES_RESULT ($PACKAGES_SELECTED)"
          expect() {
            local selected="$1" result="$2"
            if [ "$selected" = true ]; then test "$result" = success; else test "$result" = skipped; fi
          }
          expect "$API_SELECTED" "$API_RESULT"
          expect "$WEB_SELECTED" "$WEB_RESULT"
          expect "$PACKAGES_SELECTED" "$PACKAGES_RESULT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download API blob reports
        if: needs.changes.outputs.api-unit == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-blob-api-*
          path: apps/api/.vitest-reports/
          merge-multiple: true

      - name: Download web blob reports
        if: needs.changes.outputs.web == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-blob-web-*
          path: apps/web/.vitest-reports/
          merge-multiple: true

      # A missing blob would only lower coverage, so require the exact count first.
      - name: Merge API shards and enforce API coverage thresholds
        if: needs.changes.outputs.api-unit == 'true'
        working-directory: apps/api
        run: |
          test "$(find .vitest-reports -name 'blob-*.json' | wc -l)" -eq 3
          pnpm exec vitest run --merge-reports --coverage

      - name: Merge web shards and enforce web coverage thresholds
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
        working-directory: apps/web
        run: |
          test "$(find .vitest-reports -name 'blob-*.json' | wc -l)" -eq 2
          pnpm exec vitest run --merge-reports --coverage

  # The only job that runs the public-site browser tests and the Storybook audit. It
  # runs when apps/www, packages/ui (which www depends on) or a shared root input changed.
  # It replaced the Marketing Site job, which repeated the public-site browser tests on
  # a second runner; that job's www lint and type check run here when root Lint and
  # Build and Type Check (which cover apps/www) did not run.
  workspace-quality-surfaces:
    name: Workspace Quality Surfaces
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft && (needs.changes.outputs.public-site == 'true' || needs.changes.outputs.browser-install == 'true')
    timeout-minutes: 30
    # Pinned: Playwright cannot install Chromium on ubuntu-26.04 (ubuntu-latest since 2026-11-14).
    # Unpin with tasks/backlog/2026-11-15-vm-agent-reproducible-build-across-runners.md follow-ups.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Require test coverage scripts for every tested workspace
        run: pnpm quality:workspace-test-surfaces

      - name: Lint marketing site
        if: needs.changes.outputs.repo-quality != 'true'
        run: pnpm --filter @simple-agent-manager/www lint

      - name: Type check marketing site
        if: needs.changes.outputs.repo-quality != 'true'
        run: pnpm --filter @simple-agent-manager/www typecheck

      - name: Build Storybook production bundle
        run: pnpm --filter @simple-agent-manager/ui build-storybook

      - name: Build public docs and check internal links
        run: pnpm --filter @simple-agent-manager/www build && pnpm --filter @simple-agent-manager/www check:links

      # The helper reruns the same install against a fallback Ubuntu mirror when the
      # runner's own apt mirrors are unreachable. See the script header.
      - name: Install Chromium
        working-directory: packages/ui
        run: bash ../../scripts/ci/run-with-apt-mirror-fallback.sh ./node_modules/.bin/playwright install --with-deps chromium

      - name: Audit Storybook in desktop and mobile browsers
        run: pnpm --filter @simple-agent-manager/ui test:storybook

      - name: Test public site in desktop and mobile browsers
        run: pnpm --filter @simple-agent-manager/www test:browser

      - name: Require complete Storybook and public browser evidence
        run: pnpm quality:browser-evidence

      - name: Upload workspace browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-browser-evidence
          path: .codex/tmp/playwright-screenshots/
          if-no-files-found: error
          retention-days: 7

  playwright-visual:
    name: Playwright Visual Tests
    needs: [changes]
    # Blocking: a failure here fails the Durable Object Workers merge gate. Visual
    # audits only matter for reviewing a change, so they never run on push to main.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && (needs.changes.outputs.web-ui == 'true' || needs.changes.outputs.browser-install == 'true')
    timeout-minutes: 45
    # Pinned: Playwright cannot install Chromium on ubuntu-26.04 (ubuntu-latest since 2026-11-14).
    # Unpin with tasks/backlog/2026-11-15-vm-agent-reproducible-build-across-runners.md follow-ups.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bash ../../scripts/ci/run-with-apt-mirror-fallback.sh npx playwright install --with-deps chromium

      - name: Prepare screenshot output directory
        working-directory: apps/web
        run: mkdir -p ../../.codex/tmp/playwright-screenshots

      - name: Select non-quarantined Playwright visual audits
        id: visual-audits
        run: |
          pnpm exec tsx scripts/quality/select-playwright-visual-audits.ts \
            > /tmp/playwright-visual-audits.txt
          echo "Selected Playwright visual audit specs:"
          sed 's/^/  - /' /tmp/playwright-visual-audits.txt

      - name: Run Playwright visual audit tests
        id: playwright
        working-directory: apps/web
        run: |
          xargs npx playwright test \
            --project='iPhone 14 (390x844)' \
            --reporter=list \
            < /tmp/playwright-visual-audits.txt
        env:
          CI: true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-screenshots
          path: .codex/tmp/playwright-screenshots/
          retention-days: 7

  deploy-scripts:
    name: Validate Deploy Scripts
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft && needs.changes.outputs.deploy-scripts == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce source file size limits
        run: pnpm quality:file-sizes

      - name: Type check deployment scripts
        run: |
          pnpm exec tsc --project scripts/deploy/tsconfig.json --noEmit
          pnpm exec tsc --project scripts/selfhost/tsconfig.json --noEmit

      - name: Validate script syntax
        run: |
          # Verify scripts can be parsed
          npx tsx --check scripts/deploy/setup-github.ts
          npx tsx --check scripts/deploy/sync-wrangler-config.ts
          npx tsx --check scripts/deploy/generate-keys.ts

      # Deploy/quality script behavior — includes the Durable Object migration
      # compatibility regression suite (clean install vs applied history).
      - name: Run deploy and quality script tests
        run: pnpm quality:scripts:test

      # celld wrangler.json generator, plaintext deploy (--init/--dry-run), upgrade, root-only
      # secret files, pinned versions. No Docker, celld or frp: those run on a box.
      - name: Run self-host packaging tests
        run: pnpm selfhost:test

      - name: Verify installer engine, runtime integrity and bounded proof contracts
        run: |
          pnpm exec vitest run --config scripts/deploy/installer-engine.vitest.config.ts
          node --test scripts/deploy/installer-pure-build.test.mjs scripts/deploy/installer-builder-bootstrap.test.mjs scripts/deploy/installer-builder-tools.test.mjs scripts/deploy/installer-build-cache.test.mjs scripts/deploy/installer-source-cache.test.mjs

      - name: Validate wrangler binding consistency
        run: pnpm quality:wrangler-bindings

      - name: Validate agent install manifest consistency
        run: pnpm quality:agent-install-manifest

  # Quick check (also runs on draft PRs). It also runs the CI wiring tests, which had
  # their own CI Workflow job, so it runs for CI-routing changes as well.
  code-quality:
    name: Code Quality Checks
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && (needs.changes.outputs.repo-quality == 'true' || needs.changes.outputs.ci-workflow == 'true' || needs.changes.outputs.agent-instructions == 'true')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: D1 migration safety check (blocks destructive DROP TABLE)
        run: pnpm quality:migration-safety

      - name: D1 migration ordering check (blocks ambiguous prefixes)
        run: pnpm quality:migration-ordering

      - name: DO migration safety check (blocks destructive patterns in Durable Object SQLite)
        run: pnpm quality:do-migration-safety

      - name: AST-based code quality checks
        run: pnpm quality:ast-checks

      - name: Shared in-flight join guard (no unbounded await of another request's promise)
        run: pnpm quality:shared-flight-joins

      - name: File size limit enforcement
        run: pnpm quality:file-sizes

      # Every path-scoped rule can load, rules follow the code they name, the generated
      # rule indexes are current, hook entries are well-formed, and instruction size
      # stays under the ceilings in scripts/quality/agent-context-budget.json.
      - name: Agent instruction delivery and budget check
        run: pnpm quality:agent-context-budget --check

      # The Codex rule-delivery hook, the Stop gate shared by Claude Code and Codex, and the
      # instruction model, each driven through the real script against fixture repositories.
      - name: Agent instruction and hook tests
        run: pnpm quality:agent-tooling:test

      # Rule 73, mechanical half: a non-string scalar field of an options or patch value
      # must not be copied onto existing state without a "not supplied" check. Blocking from
      # the start: zero findings on the tree and in 25 sampled commits since February 2026,
      # apart from the original incident, which it reports (scripts/quality/README.md).
      - name: Setup Go for the optional-field check
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Optional struct fields must not overwrite on absence (rule 73)
        run: pnpm quality:go-optional-fields

      - name: Stale artifact check
        run: pnpm quality:stale-artifacts
      - name: Repo quality visibility report
        continue-on-error: true
        run: pnpm quality:repo-visibility

      - name: Source-contract test detection
        run: pnpm quality:source-contract-tests

      - name: Dependency governance pinning check
        run: pnpm quality:dependency-governance

      - name: Workspace test surface completeness
        run: pnpm quality:workspace-test-surfaces

      - name: Direct dependency evidence
        run: pnpm quality:direct-dependency-evidence

      - name: Prevent new runtime environment tunables
        run: pnpm quality:runtime-tunables

      - name: Runtime-boundary semantic check (blocking for apps/api/src)
        run: pnpm quality:runtime-boundary-semantics

      - name: Native node-pool allocation boundaries
        run: pnpm quality:node-pool-boundary

      - name: CI workflow wiring tests
        run: pnpm exec vitest run --config scripts/quality/vitest.config.ts ci-quality-program.test.ts ci-worker-suite.test.ts check-runtime-tunables.test.ts ci-workspace-surfaces.test.ts ci-browser-install.test.ts ci-evidence-token-wiring.test.ts ci-test-shards.test.ts ci-draft-and-gate.test.ts ci-suite-selection.test.ts

  go-vulnerability-diff:
    name: Go Vulnerability Diff
    needs: [changes]
    if: needs.changes.outputs.go-modules == 'true' && !github.event.pull_request.draft
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Assert Go version
        run: go version | grep -E '^go version go1\.26\.11 '

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install govulncheck
        run: |
          mkdir -p "$RUNNER_TEMP/go/bin"
          cd scripts/quality/govulncheck-tool
          go build -o "$RUNNER_TEMP/go/bin/govulncheck" golang.org/x/vuln/cmd/govulncheck

      - name: Scan changed Go modules
        env:
          SAM_GOVULNCHECK_BIN: ${{ runner.temp }}/go/bin/govulncheck
        run: pnpm quality:govulncheck-diff

  durable-object-worker-shards:
    name: Durable Object Workers shard (${{ matrix.shard }}/7)
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft && needs.changes.outputs.api == 'true'
    # Keep per-file storage isolation and serial workerd execution within each
    # runner. Seven shards balanced by measured per-file time (about 7 min of tests each
    # on the slower runner class, which the timings reflect; about 4.5 on the faster one;
    # apps/api/tests/workers/shard-timings.json). Seven keeps a Workers shard under the
    # Test api shards plus the Test merge, so an API PR finishes in about 10 min. Refresh
    # the timings from the workers-timings-* artifacts with
    # tests/workers/support/update-shard-timings.ts.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Durable Object migration safety
        run: pnpm quality:do-migration-safety

      - name: Build API dependencies
        run: pnpm exec turbo run build --filter=@simple-agent-manager/api^...

      - name: Run Worker and Durable Object suites
        env:
          WORKERS_SHARD: ${{ matrix.shard }}
        run: pnpm --filter @simple-agent-manager/api test:workers --shard="${WORKERS_SHARD}/7" --reporter=default --reporter=./tests/workers/timing-reporter.ts

      - name: Upload per-file Workers timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workers-timings-${{ matrix.shard }}
          path: apps/api/test-results/workers-timing.json

  # The merge gate. Ruleset "Main" requires exactly one check, named
  # "Durable Object Workers", and the agent token cannot edit the ruleset, so this job
  # keeps that name and now gates the whole suite instead of only the Workers shards.
  #
  # Two holes it closes:
  # - A skipped job reports success. Before, this check was skipped (green) on every PR
  #   that did not touch the API, so a red Test never blocked a merge.
  # - Draft PRs skip the full suite. On a draft run this job carries a different name,
  #   so the draft run never reports a "Durable Object Workers" result for the commit.
  #   After the PR is marked ready the check stays "expected" (merge blocked) until the
  #   ready run finishes every job, instead of inheriting the draft run's skipped jobs.
  #
  # PR Evidence is deliberately not a dependency: it validates PR-body text, which a
  # human may waive, and it is not a property of the code being merged.
  #
  # `always()`, not `!cancelled()`: in a cancelled run this job still runs and fails.
  # A skipped job would read as green to the ruleset.
  durable-object-workers:
    # Only ready-PR runs and main pushes report the required name. A manual dispatch on a
    # branch skips the PR-only jobs (Playwright Visual Tests, PR Evidence), so it must not
    # satisfy the required check for that commit either.
    name: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)) && 'Durable Object Workers' || 'Full suite gate (not a merge check for this run)' }}
    needs:
      - changes
      - lint
      - secret-scan
      - typecheck
      - test-api
      - test-web
      - test-packages
      - test
      - workspace-quality-surfaces
      - playwright-visual
      - deploy-scripts
      - code-quality
      - go-vulnerability-diff
      - durable-object-worker-shards
      - pulumi-infra
      - vm-agent-test
      - selfhost-email
      - cli-test
      - vm-agent-integration
      - devcontainer
      - devcontainer-volume-mount
    if: always() && (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # Skipped, cancelled or failed shards must never turn this check green for API changes.
      - name: Require every Workers shard to pass
        if: needs.changes.outputs.api == 'true'
        env:
          SHARD_RESULT: ${{ needs.durable-object-worker-shards.result }}
        run: test "$SHARD_RESULT" = success

      # A job skipped by its own path filter is fine; a failed or cancelled one is not.
      # A job skipped because something it needs failed is caught through that need,
      # which is listed here too.
      - name: Require every other CI job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Compare the printed value: `jq -e` exits 0 on empty input in some jq versions.
          if [ "$(jq -r '.changes.result' <<<"$NEEDS_JSON")" != success ]; then
            echo "::error::Detect Changes did not succeed"
            exit 1
          fi
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$NEEDS_JSON")
          if [ -n "$failed" ]; then
            printf '::error::CI jobs did not pass: %s\n' "$(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          echo "Every CI job passed or was skipped by its path filter."

  pulumi-infra:
    name: Pulumi Infrastructure Tests
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.repository == 'raphaeltm/simple-agent-manager') && !github.event.pull_request.draft && needs.changes.outputs.infra == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check Pulumi infra
        working-directory: infra
        run: pnpm typecheck

      - name: Run Pulumi unit tests
        working-directory: infra
        run: pnpm test

  vm-agent-test:
    name: VM Agent Test
    needs: [changes]
    if: needs.changes.outputs.vm-agent == 'true' && !github.event.pull_request.draft
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/vm-agent/go.sum

      - name: Assert Go version
        run: go version | grep -E '^go version go1\.26\.11 '

      # The real Instant collect route resolves its canonical /workspaces mount.
      - name: Prepare Instant workspace mountpoint
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /workspaces

      - name: Run VM Agent tests
        working-directory: packages/vm-agent
        run: go test -race ./...

  selfhost-email:
    name: Self-host Email
    needs: [changes]
    if: needs.changes.outputs.selfhost-email == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/selfhost-email-tests.yml

  cli-test:
    name: CLI Test
    needs: [changes]
    if: needs.changes.outputs.cli == 'true' && !github.event.pull_request.draft
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Assert Go version
        run: go version | grep -E '^go version go1\.26\.11 '

      - name: Run CLI tests
        working-directory: packages/cli
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Worker contract fixture dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # pnpm 9 has no approved-build dependency list in this repository.
      # Run only these lockfile-pinned native builds required by the fixtures.
      - name: Build trusted native fixture dependencies
        run: pnpm --filter @simple-agent-manager/api rebuild better-sqlite3 esbuild

      - name: Build Worker contract fixture dependencies
        run: pnpm --filter '@simple-agent-manager/api^...' build

      - name: Verify Go CLI against Worker route contracts
        run: |
          (cd packages/cli && go build -o "$RUNNER_TEMP/sam-cli-contract" ./cmd/sam)
          SAM_CLI_CONTRACT_BINARY="$RUNNER_TEMP/sam-cli-contract" pnpm --filter @simple-agent-manager/api exec vitest run tests/unit/routes/cli-worker-contract.test.ts tests/unit/routes/task-submit-capacity-pools.test.ts

      - name: Verify deployment publish timeout defaults across Worker and Go
        env:
          SAM_PUBLISH_TIMEOUT_CONTRACT: '1'
        run: pnpm --filter @simple-agent-manager/api exec vitest run tests/unit/services/deployment-publish-timeout-contract.test.ts --maxWorkers=1

      - name: Cross-build CLI
        working-directory: packages/cli
        run: make build-all

      - name: Print CLI coverage summary
        working-directory: packages/cli
        run: go tool cover -func=coverage.out

      - name: Upload CLI coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-go-coverage
          path: packages/cli/coverage.out
          retention-days: 7

  # Also runs the VM Agent E2E tests: both need the devcontainer CLI and the same
  # fixture images, and E2E alone took about a minute on its own runner.
  vm-agent-integration:
    name: VM Agent Integration
    needs: [changes]
    if: needs.changes.outputs.vm-agent == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/vm-agent/go.sum

      - name: Assert Go version
        run: go version | grep -E '^go version go1\.26\.11 '

      - name: Install devcontainers CLI
        run: npm install -g --ignore-scripts "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}"

      - name: Prepare devcontainer fixture images
        run: bash scripts/ci/prepare-devcontainer-fixture-images.sh

      - name: Verify pinned runtime image
        run: bash scripts/ci/verify-codex-runtime-image.sh

      - name: Run VM Agent integration tests
        working-directory: packages/vm-agent
        run: go test -race -v -tags integration -timeout 15m ./internal/bootstrap/ ./internal/acp/

      - name: Run VM Agent E2E tests
        working-directory: packages/vm-agent
        run: go test -race -v -tags e2e -timeout 15m ./internal/e2e/

  devcontainer:
    name: Devcontainer Validation
    needs: [changes]
    if: needs.changes.outputs.devcontainer == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install devcontainer CLI
        run: npm install -g --ignore-scripts "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}"

      - name: Prepare devcontainer fixture images
        run: bash scripts/ci/prepare-devcontainer-fixture-images.sh

      - name: Validate devcontainer.json syntax
        run: |
          # devcontainer.json supports JSONC (comments + trailing commas)
          # Use node to parse it since JSON.parse doesn't handle comments
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('.devcontainer/devcontainer.json', 'utf8');
            // Strip single-line comments and trailing commas before closing braces/brackets
            const stripped = raw
              .replace(/\/\/.*$/gm, '')
              .replace(/,(\s*[}\]])/g, '\$1');
            JSON.parse(stripped);
            console.log('devcontainer.json syntax: OK');
          "

      - name: Build devcontainer image
        run: devcontainer build --workspace-folder .

      - name: Start devcontainer with full lifecycle hooks
        run: |
          set -e

          echo "=== Starting devcontainer (running postCreateCommand + postStartCommand) ==="
          OUTPUT=$(devcontainer up --workspace-folder .)
          echo "$OUTPUT"

          # Extract container ID from JSON output
          CONTAINER_ID=$(echo "$OUTPUT" | jq -r '.containerId // empty' 2>/dev/null || true)
          if [ -z "$CONTAINER_ID" ]; then
            echo "Error: Could not extract container ID from devcontainer up output"
            exit 1
          fi
          echo "Container ID: $CONTAINER_ID"

      - name: Verify devcontainer feature tools
        run: |
          # Tools installed by devcontainer features (docker-in-docker, github-cli, go)
          devcontainer exec --workspace-folder . bash -c '
            set -e
            FAIL=0

            check() {
              local name="$1"
              shift
              if output=$("$@" 2>&1); then
                echo "OK: $name — $output"
              else
                echo "FAIL: $name"
                FAIL=$((FAIL + 1))
              fi
            }

            echo "=== Devcontainer Feature Tools ==="
            check "Node.js"     node --version
            check "npm"         npm --version
            check "pnpm"        pnpm --version
            check "Go"          go version
            check "Docker"      docker --version
            check "GitHub CLI"  gh --version
            check "git"         git --version
            check "curl"        curl --version
            check "jq"          jq --version

            exit $FAIL
          '

      - name: Verify post-create hook tools
        run: |
          # Tools installed by .devcontainer/post-create.sh
          devcontainer exec --workspace-folder . bash -c '
            set -e
            FAIL=0

            check() {
              local name="$1"
              shift
              if output=$("$@" 2>&1); then
                echo "OK: $name — $(echo "$output" | head -1)"
              else
                echo "FAIL: $name"
                FAIL=$((FAIL + 1))
              fi
            }

            optional_check() {
              local name="$1"
              shift
              if output=$("$@" 2>&1); then
                echo "OK: $name — $(echo "$output" | head -1)"
              else
                echo "WARNING: optional $name unavailable — $(echo "$output" | head -1)"
              fi
            }

            echo "=== Post-Create Hook Tools ==="
            # post-create.sh installs these with try_run so transient external
            # installer failures do not make the workspace invalid.
            optional_check "Claude Code"   claude --version
            optional_check "OpenAI Codex"  codex --version
            optional_check "happy-coder"   happy --version
            optional_check "Playwright"    npx playwright --version

            echo ""
            echo "=== Post-Create Hook Build Artifacts ==="

            # Verify pnpm install ran (node_modules exists)
            if [ -d "node_modules" ]; then
              echo "OK: node_modules directory exists"
            else
              echo "FAIL: node_modules directory missing — pnpm install did not run"
              FAIL=$((FAIL + 1))
            fi

            # Verify pnpm build ran (check for built package outputs)
            BUILD_FAIL=0
            for pkg in packages/shared packages/ui packages/terminal packages/acp-client; do
              if [ -d "$pkg/dist" ]; then
                echo "OK: $pkg/dist exists"
              else
                echo "FAIL: $pkg/dist missing — pnpm build did not complete"
                BUILD_FAIL=1
              fi
            done
            FAIL=$((FAIL + BUILD_FAIL))

            exit $FAIL
          '

      - name: Verify post-start hook
        run: |
          # post-start.sh runs "happy daemon start"
          devcontainer exec --workspace-folder . bash -c '
            set -e
            echo "=== Post-Start Hook Verification ==="

            if ! command -v happy >/dev/null 2>&1; then
              echo "WARNING: happy binary unavailable; postStartCommand treats this as non-fatal"
              exit 0
            fi

            # The happy daemon should have been started by postStartCommand
            if happy daemon status 2>&1 | grep -qi "running\|started\|active"; then
              echo "OK: happy daemon is running"
            else
              STATUS=$(happy daemon status 2>&1 || true)
              echo "WARNING: happy daemon status unclear: $STATUS"
              # Not a hard failure — daemon may not persist in CI environment
              echo "Verifying happy binary is at least callable..."
              happy --version
              echo "OK: happy binary is functional"
            fi
          '

      - name: Verify MCP server configuration
        run: |
          devcontainer exec --workspace-folder . bash -c '
            set -e
            FAIL=0

            echo "=== MCP Server Configuration ==="

            # Claude MCP servers are configured only when the non-fatal Claude
            # install succeeds and the binary is available on PATH.
            if command -v claude >/dev/null 2>&1; then
              for server in playwright sequential-thinking context7 cloudflare-observability; do
                if claude mcp get "$server" >/dev/null 2>&1; then
                  echo "OK: Claude MCP server '$server' configured"
                else
                  echo "FAIL: Claude MCP server '$server' not found"
                  FAIL=$((FAIL + 1))
                fi
              done
            else
              echo "WARNING: Claude CLI unavailable; skipping Claude MCP server verification"
            fi

            # Codex Cloudflare Observability MCP is intentionally opt-in after
            # OAuth login. post-create.sh prints the setup commands instead of
            # configuring it automatically, so absence here must not fail the
            # devcontainer validation.
            if codex mcp get cloudflare-observability >/dev/null 2>&1; then
              echo "OK: Codex MCP server 'cloudflare-observability' configured"
            else
              echo "WARNING: Codex MCP server 'cloudflare-observability' not configured; opt in with codex mcp add/login after OAuth"
            fi

            exit $FAIL
          '

          echo ""
          echo "=== Devcontainer full validation passed ==="

  devcontainer-volume-mount:
    name: Devcontainer Volume Mount
    needs: [changes]
    if: needs.changes.outputs.devcontainer-volume-mount == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install devcontainer CLI
        run: npm install -g --ignore-scripts "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}"

      - name: Prepare devcontainer fixture images
        run: bash scripts/ci/prepare-devcontainer-fixture-images.sh

      - name: Run SAM volume mount devcontainer test
        run: bash scripts/ci/test-devcontainer-volume-mount.sh .
