name: E2E Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/vm-agent/**'
      - 'packages/shared/**'
      - 'packages/task-runner/**'
      - 'scripts/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

env:
  GO_VERSION: '1.26.6'

jobs:
  vm-agent-smoke:
    name: VM Agent Smoke (${{ matrix.control_plane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - control_plane: mock
            command: pnpm test:e2e:vm-agent-smoke
          - control_plane: worker
            command: pnpm test:e2e:vm-agent-smoke:worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Assert Go version
        run: go version | grep -E '^go version go1\.26\.6 '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke test
        run: bash -lc "$SMOKE_COMMAND"
        env:
          SMOKE_COMMAND: ${{ matrix.command }}
