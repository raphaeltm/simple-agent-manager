name: Verify production GitHub trigger

# Manual-only: never consume code or artifacts from a workflow_run or a fork PR.
on:
  workflow_dispatch:
    inputs:
      target_commit_sha:
        description: 'Reviewed current main SHA with successful canonical push CI'
        required: true
        type: string
      github_trigger_audit_fixture:
        description: 'Nonsecret operator-prepared fixture JSON; no tokens or signatures'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.repository == 'raphaeltm/simple-agent-manager' && 'deploy-production' || format('deploy-production-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate-manual-dispatch:
    name: Validate manual production target
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'raphaeltm/simple-agent-manager' }}
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.gate.outputs.deploy_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate exact SHA and CI gate
        id: gate
        run: pnpm tsx scripts/deploy/validate-production-dispatch.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_COMMIT_SHA: ${{ inputs.target_commit_sha }}

  github-trigger-audit:
    name: Send bounded production GitHub audit fixture
    needs: validate-manual-dispatch
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'raphaeltm/simple-agent-manager' && needs.validate-manual-dispatch.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout trusted production main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
      - name: Verify checked-out production SHA
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.validate-manual-dispatch.outputs.deploy_sha }}
        run: |
          if [[ ! "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production audit requires a valid approved commit SHA" >&2
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [[ "$checked_out_sha" != "$EXPECTED_DEPLOY_SHA" ]]; then
            echo "Production audit checkout does not match the validated SHA" >&2
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Send prepared signed fixture
        env:
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_TRIGGER_AUDIT_FIXTURE: ${{ inputs.github_trigger_audit_fixture }}
          GITHUB_TRIGGER_AUDIT_ENVIRONMENT: production
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          SMOKE_TEST_API_URL: https://api.${{ vars.BASE_DOMAIN }}
        run: node scripts/e2e/github-trigger-staging.mjs --phase=send
