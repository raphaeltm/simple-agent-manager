name: Deploy Installer

on:
  push:
    branches: [main, 'sam/**']
    paths:
      - 'apps/installer/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Installer target
        type: choice
        options: [staging, production]
        default: staging
      mode:
        description: 'Installer capability mode (preserve keeps the currently deployed mode and consent scopes)'
        type: choice
        options: [preserve, bootstrap, full]
        default: preserve

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'raphaeltm/simple-agent-manager' &&
      (github.event_name != 'workflow_dispatch' || inputs.environment != 'production' || github.ref == 'refs/heads/main')
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simple-agent-manager/installer typecheck
      - run: pnpm --filter @simple-agent-manager/installer lint
      - run: pnpm --filter @simple-agent-manager/installer test
      - name: Browser audit
        run: |
          pnpm --filter @simple-agent-manager/installer exec playwright install --with-deps chromium
          pnpm --filter @simple-agent-manager/installer dev > /tmp/installer-dev.log 2>&1 &
          INSTALLER_DEV_PID=$!
          trap 'kill "$INSTALLER_DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8787/health > /dev/null; then break; fi
            sleep 1
          done
          pnpm --filter @simple-agent-manager/installer test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-browser-evidence
          path: .codex/tmp/playwright-screenshots/installer-*.png
          retention-days: 14
      - name: Verify and clean up staging bootstrap
        if: (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') || (github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main')
        run: pnpm --filter @simple-agent-manager/installer exec tsx scripts/staging-smoke.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          INSTALLER_ENVIRONMENT: staging
      - name: Deploy isolated installer and configure OAuth
        run: pnpm --filter @simple-agent-manager/installer run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          INSTALLER_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
          INSTALLER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'preserve' }}
          OAUTH_REGISTRATION_TOKEN: ${{ secrets.OAUTH_REGISTRATION_TOKEN }}
      - name: Verify deployed version
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          node --input-type=module - <<'JS'
          const response = await fetch(`https://install.${process.env.BASE_DOMAIN}/health`);
          const data = await response.json();
          if (!response.ok || data.sha !== process.env.GITHUB_SHA || !data.oauthConfigured) throw new Error('Installer readiness check failed');
          console.log('Installer health and deployed commit verified');
          JS
