name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      provider_limit_fixture:
        description: Temporary exact-task staging provider-limit fixture
        type: boolean
        default: false
      performance_audit:
        description: 'Run bounded admin/Runtime browser timings and screenshots with the staging smoke account'
        type: boolean
        default: false
      performance_audit_only:
        description: 'Audit the current staging deployment without redeploying (requires performance_audit)'
        type: boolean
        default: false
      activation_only:
        description: 'Run C storage activation on the already deployed candidate; skip deployment'
        type: boolean
        default: false
      activation_expected_sha:
        description: 'Exact deployed candidate SHA for C activation'
        type: string
      activation_expected_version:
        description: 'Expected live Cloudflare Worker version at 100%'
        type: string
      activation_cutover_at:
        description: 'Future aligned Unix second; retain on retries'
        type: string
      activation_publish:
        description: 'Publish immutable activation; false is read-only preflight'
        type: boolean
        default: false
      activation_verify_workspace_id:
        description: 'Optional own release workspace ID for fixed read-only DO evidence (publish must be false)'
        type: string
      activation_verify_rate_identity:
        description: 'Optional own release MCP identity for fixed read-only DO evidence'
        type: string
      dry_run:
        description: 'Preview changes without applying'
        required: false
        type: boolean
        default: false
      agent_email_dns_audit:
        description: 'Verify provider preserves merged SPF, then restore staging DNS'
        type: boolean
        default: false
      github_trigger_audit:
        description: 'Run one bounded signed GitHub-trigger staging admission audit'
        required: false
        type: boolean
        default: false
      github_trigger_audit_send_only:
        description: 'Send the prepared audit fixture on the already deployed candidate; skip deployment'
        required: false
        type: boolean
        default: false
      github_trigger_audit_fixture:
        description: 'Nonsecret prepared fixture JSON; no tokens or signatures'
        required: false
        type: string

# Only one staging deployment at a time; queue (don't cancel) concurrent requests
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: 1.59.1

permissions:
  contents: read
  deployments: none
  id-token: none

jobs:
  deploy:
    if: ${{ !inputs.provider_limit_fixture && !inputs.github_trigger_audit_send_only && !inputs.activation_only && !inputs.performance_audit_only }}
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: staging
      skip_agent: false # Required: staging VMs need the agent binary in R2
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  # Smoke tests run after successful staging deployment.
  # Requires SMOKE_TEST_TOKEN secret in the staging environment.
  # Skipped if the token is not configured (new deployments before token setup).
  smoke-tests:
    needs: deploy
    if: ${{ always() && !inputs.provider_limit_fixture && !inputs.activation_only && !inputs.dry_run && (needs.deploy.result == 'success' || (inputs.performance_audit && inputs.performance_audit_only) || (inputs.github_trigger_audit && inputs.github_trigger_audit_send_only)) }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SMOKE_TEST_TOKEN: ${{ !inputs.github_trigger_audit_send_only && secrets.SMOKE_TEST_TOKEN || '' }}
      SMOKE_TEST_URL: https://app.${{ vars.BASE_DOMAIN }}
      SMOKE_TEST_API_URL: https://api.${{ vars.BASE_DOMAIN }}
      SAM_PERFORMANCE_AUDIT: ${{ inputs.performance_audit && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Playwright
        if: ${{ !inputs.github_trigger_audit_send_only }}
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y > /dev/null 2>&1
          npm install --ignore-scripts "@playwright/test@${PLAYWRIGHT_VERSION}"
          node node_modules/@playwright/test/cli.js install chromium
          mkdir -p $GITHUB_WORKSPACE/node_modules/.bin
          ln -sf /tmp/pw/node_modules/@playwright $GITHUB_WORKSPACE/node_modules/@playwright
          ln -sf /tmp/pw/node_modules/playwright $GITHUB_WORKSPACE/node_modules/playwright
          ln -sf /tmp/pw/node_modules/playwright-core $GITHUB_WORKSPACE/node_modules/playwright-core
          ln -sf /tmp/pw/node_modules/.bin/playwright $GITHUB_WORKSPACE/node_modules/.bin/playwright

      - name: Require credentials for an explicit performance audit
        if: ${{ inputs.performance_audit && env.SMOKE_TEST_TOKEN == '' }}
        run: |
          echo '::error::SMOKE_TEST_TOKEN is required for the requested staging performance audit'
          exit 1

      - name: Run smoke tests
        if: ${{ !inputs.github_trigger_audit_send_only && !inputs.performance_audit_only && env.SMOKE_TEST_TOKEN != '' }}
        run: node node_modules/@playwright/test/cli.js test --config=tests/smoke/playwright.config.ts

      - name: Run current-deployment performance audit only
        if: ${{ inputs.performance_audit && inputs.performance_audit_only && env.SMOKE_TEST_TOKEN != '' }}
        run: node node_modules/@playwright/test/cli.js test --config=tests/smoke/playwright.config.ts admin-runtime-performance.spec.ts

      - name: Upload bounded performance audit
        if: ${{ always() && inputs.performance_audit }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-runtime-performance-${{ github.run_id }}
          if-no-files-found: error
          path: .codex/tmp/smoke-test-results/**/performance/
          retention-days: 7

      - name: Skip notice (no token configured)
        if: ${{ !inputs.github_trigger_audit_send_only && env.SMOKE_TEST_TOKEN == '' }}
        run: echo "⚠ Smoke tests skipped — SMOKE_TEST_TOKEN not configured in staging environment secrets"

      - name: Send prepared signed GitHub trigger fixture (opt-in)
        if: ${{ inputs.github_trigger_audit && inputs.github_trigger_audit_send_only }}
        env:
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_TRIGGER_AUDIT_FIXTURE: ${{ inputs.github_trigger_audit_fixture }}
        run: node scripts/e2e/github-trigger-staging.mjs --phase=send

  storage-activation:
    if: ${{ !inputs.provider_limit_fixture && inputs.activation_only }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify candidate and activate storage
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          DEPLOY_ENVIRONMENT: staging
          EXPECTED_SHA: ${{ inputs.activation_expected_sha }}
          EXPECTED_VERSION: ${{ inputs.activation_expected_version }}
          CUTOVER_AT: ${{ inputs.activation_cutover_at }}
          PUBLISH_ACTIVATION: ${{ inputs.activation_publish }}
          VERIFY_WORKSPACE_ID: ${{ inputs.activation_verify_workspace_id }}
          VERIFY_RATE_IDENTITY: ${{ inputs.activation_verify_rate_identity }}
        run: node scripts/deploy/reliability-storage-activation.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: reliability-storage-activation-staging
          path: reliability-storage-activation.json
          if-no-files-found: ignore

  agent-email-dns-audit:
    needs: deploy
    if: ${{ !inputs.provider_limit_fixture && inputs.agent_email_dns_audit && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify merged SPF compatibility and restore original DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          DEPLOY_ENVIRONMENT: staging
        run: node scripts/e2e/agent-email-dns-staging.mjs

  provider-limit-fixture:
    if: ${{ inputs.provider_limit_fixture }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Seed one disposable sleeping task only
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.equal(process.env.CF_ACCOUNT_ID, 'c4e4aebd980b626f6af43ac6b1edcede');
          const taskId = '01M6SVSNJJNNTP1E7YVWHQVFFV';
          const projectId = '01KWHD8XS7MQ7R6KWXJYRHDVH4';
          const sessionId = '5ec1e787-095b-4bd7-8fd0-507444530255';
          const nonce = '801217bb-648d-4298-8ae8-134611ef8c29';
          const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/d1/database/1cfaf5d4-8226-47d8-bf26-6ba727ce5718/query`;
          async function query(sql, params) {
            const response = await fetch(url, { method: 'POST', headers: { Authorization: `Bearer ${process.env.CF_API_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ sql, params }) });
            const result = await response.json();
            assert.equal(result.success, true, JSON.stringify(result.errors));
            return result.result[0];
          }
          const checked = await query('SELECT t.id,t.description,t.status,t.provider_limit_wait_json,s.status AS snapshot_status,s.sleep_status FROM tasks t JOIN session_snapshots s ON s.chat_session_id=t.chat_session_id AND s.project_id=t.project_id AND s.user_id=t.user_id WHERE t.id=? AND t.project_id=? AND t.chat_session_id=?', [taskId,projectId,sessionId]);
          assert.equal(checked.results.length, 1);
          const task = checked.results[0];
          assert.ok(task.description.includes(nonce));
          assert.equal(task.status, 'sleeping');
          assert.equal(task.snapshot_status, 'available');
          assert.equal(task.sleep_status, 'sleeping');
          assert.equal(task.provider_limit_wait_json, null);
          const now = Date.now();
          const reason = 'Blocked: provider limit wait budget exhausted. Review the provider limit before resuming.';
          const wait = { version:1,phase:'blocked',origin:'callback',attempts:4,credentialKey:null,incidentId:`staging:${nonce}`,observedAt:now,resetsAt:null,nextRetryAt:now,deadlineAt:now+1800000,scheduleKey:`provider-limit:${taskId}:staging:${nonce}`,reason };
          const updated = await query("UPDATE tasks SET provider_limit_wait_json=?,admission_state='provider_limit_blocked',admission_reason=?,admission_next_retry_at=NULL WHERE id=? AND project_id=? AND chat_session_id=? AND status='sleeping' AND provider_limit_wait_json IS NULL AND description LIKE ? AND EXISTS(SELECT 1 FROM session_snapshots s WHERE s.chat_session_id=tasks.chat_session_id AND s.project_id=tasks.project_id AND s.user_id=tasks.user_id AND s.status='available' AND s.sleep_status='sleeping')", [JSON.stringify(wait),reason,taskId,projectId,sessionId,`%${nonce}%`]);
          assert.equal(updated.meta.changes, 1);
          console.log(JSON.stringify({ fixtureTaskId:taskId,phase:'blocked',changed:updated.meta.changes }));
          JS
