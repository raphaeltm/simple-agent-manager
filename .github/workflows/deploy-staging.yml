# Isolated maintenance branch only. Never merge this workflow into main.
name: Staging Placeholder Cleanup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Exact audited staging maintenance operation'
        required: true
        type: choice
        options:
          - placeholder-proof
          - recovery-node-proofs
          - rearm-recovery
          - retry-provider-recovery
          - inventory-helper-vm
          - adopt-helper-vm
          - helper-workspace-proof
        default: placeholder-proof
      apply:
        description: 'Apply the selected exact repair after reviewing its preview'
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: none
  id-token: none

jobs:
  repair-placeholder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline guard regressions
        run: python3 -m unittest discover -s scripts/maintenance/pr2030-placeholder-cleanup -p 'test_*.py'
      - name: Preview or persist the exact missing proof
        if: ${{ inputs.operation == 'placeholder-proof' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          APPLY_REPAIR: ${{ inputs.apply }}
        run: python3 scripts/maintenance/pr2030-placeholder-cleanup/repair.py
      - name: Preview or rearm the exact preserved snapshot
        if: ${{ inputs.operation == 'rearm-recovery' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          APPLY_REPAIR: ${{ inputs.apply }}
        run: python3 scripts/maintenance/pr2030-placeholder-cleanup/rearm.py
      - name: Preview or prove the exact pre-claim recovery nodes absent
        if: ${{ inputs.operation == 'recovery-node-proofs' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          APPLY_REPAIR: ${{ inputs.apply }}
        run: python3 scripts/maintenance/pr2030-placeholder-cleanup/node_proof.py
      - name: Preview or retry the exact provider-rejected recovery
        if: ${{ inputs.operation == 'retry-provider-recovery' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          APPLY_REPAIR: ${{ inputs.apply }}
        run: python3 scripts/maintenance/pr2030-placeholder-cleanup/retry_provider_recovery.py

      - name: Set up Node for offline SQLite adoption tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, same as deploy-reusable.yml
        with:
          node-version: '22'
      - name: Verify offline inventory and adoption guards
        run: node --test scripts/maintenance/pr2030-placeholder-cleanup/test-inventory.mjs scripts/maintenance/pr2030-placeholder-cleanup/test-adopt-helper.mjs
      - name: Install Pulumi CLI for credential reads
        if: ${{ inputs.operation == 'inventory-helper-vm' || inputs.operation == 'adopt-helper-vm' }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0, same as deploy-reusable.yml
      - name: Read exact helper provider inventory
        if: ${{ inputs.operation == 'inventory-helper-vm' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          PULUMI_STATE_BUCKET: ${{ vars.PULUMI_STATE_BUCKET }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: node scripts/maintenance/pr2030-placeholder-cleanup/inventory.mjs
      - name: Preview or adopt the exact confirmed helper VM
        if: ${{ inputs.operation == 'adopt-helper-vm' }}
        env:
          APPLY_REPAIR: ${{ inputs.apply }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          PULUMI_STATE_BUCKET: ${{ vars.PULUMI_STATE_BUCKET }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: node scripts/maintenance/pr2030-placeholder-cleanup/adopt-helper.mjs

      - name: Preview or transfer the exact terminated helper proof
        if: ${{ inputs.operation == 'helper-workspace-proof' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          APPLY_REPAIR: ${{ inputs.apply }}
        run: python3 scripts/maintenance/pr2030-placeholder-cleanup/helper_workspace_proof.py
