# Isolated maintenance branch only. Never merge this workflow into main.
name: Staging Placeholder Cleanup

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Persist the audited proof for the single PR 2030 failed placeholder'
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: none
  id-token: none

jobs:
  repair-placeholder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline guard regressions
        run: python3 -m unittest discover -s scripts/maintenance/pr2030-placeholder-cleanup -p 'test_*.py'
      - name: Preview or persist the exact missing proof
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          APPLY_REPAIR: ${{ inputs.apply }}
        run: python3 scripts/maintenance/pr2030-placeholder-cleanup/repair.py
