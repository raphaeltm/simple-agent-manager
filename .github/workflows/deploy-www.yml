name: Deploy Marketing Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/www/**'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch:

concurrency:
  group: deploy-www
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build & Deploy
    # Guard: only run on the canonical repository, not on forks. The marketing
    # site is product-specific to simple-agent-manager.org and should not deploy
    # to a fork's domain even if they have Cloudflare secrets configured.
    if: github.repository == 'raphaeltm/simple-agent-manager'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Marketing Site Project
        id: names
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
        run: node scripts/deploy/workflow-resource-names.mjs marketing

      - name: Build marketing site
        run: pnpm --filter @simple-agent-manager/www build
        env:
          SITE_URL: https://${{ steps.names.outputs.www_domain }}

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @simple-agent-manager/www exec wrangler pages deploy dist --project-name="$PAGES_PROJECT" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.names.outputs.pages_project }}

      - name: Write Job Summary
        if: always()
        run: |
          if [ "$DEPLOY_JOB_STATUS" = "success" ]; then
            echo "## Marketing Site Deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**URL:** https://${WWW_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Pages URL:** https://${PAGES_PROJECT}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
            echo "**Commit:** \`$DEPLOY_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Marketing Site Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the logs above for error details." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Troubleshooting" >> "$GITHUB_STEP_SUMMARY"
            echo "- Ensure infrastructure is provisioned (run the **Provision Marketing Site Infrastructure** workflow)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Verify \`CF_API_TOKEN\` and \`CF_ACCOUNT_ID\` secrets are set" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
          DEPLOY_COMMIT: ${{ github.sha }}
          WWW_DOMAIN: ${{ steps.names.outputs.www_domain }}
          PAGES_PROJECT: ${{ steps.names.outputs.pages_project }}
