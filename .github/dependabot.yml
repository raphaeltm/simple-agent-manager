# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/packages/vm-agent'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/packages/cli'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/packages/harness'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/scripts/quality/govulncheck-tool'
    schedule:
      interval: weekly
  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: weekly
  - package-ecosystem: 'docker'
    directory: '/scripts/e2e/workspace-mock'
    schedule:
      interval: weekly
  # Self-hosted one-box Caddy build (DNS-01 module); compose images are pinned in
  # deploy/selfhost/docker-compose.yml and checked by scripts/selfhost/versions.test.ts.
  - package-ecosystem: 'docker'
    directory: '/deploy/selfhost/caddy'
    schedule:
      interval: weekly
  # Self-hosted celld egress fence (alpine + nftables).
  - package-ecosystem: 'docker'
    directory: '/deploy/selfhost/egress-fence'
    schedule:
      interval: weekly
