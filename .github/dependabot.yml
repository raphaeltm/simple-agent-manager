# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/packages/vm-agent'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/packages/cli'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/packages/harness'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/scripts/quality/go-optional-fields'
    schedule:
      interval: weekly
  - package-ecosystem: 'gomod'
    directory: '/scripts/quality/govulncheck-tool'
    schedule:
      interval: weekly
  # Self-hosted inbound SMTP receiver for agent email (compose profile `mail-in`).
  - package-ecosystem: 'gomod'
    directory: '/deploy/selfhost/sam-mx'
    schedule:
      interval: weekly
  # Self-hosted authoritative DNS server (compose profile `dns`).
  - package-ecosystem: 'gomod'
    directory: '/deploy/selfhost/sam-dns'
    schedule:
      interval: weekly
  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: weekly
  - package-ecosystem: 'docker'
    directory: '/scripts/e2e/workspace-mock'
    schedule:
      interval: weekly
  # Self-hosted sam-mx build (golang + alpine, both pinned by digest).
  - package-ecosystem: 'docker'
    directory: '/deploy/selfhost/sam-mx'
    schedule:
      interval: weekly
  # Self-hosted sam-dns build (golang + alpine, both pinned by digest).
  - package-ecosystem: 'docker'
    directory: '/deploy/selfhost/sam-dns'
    schedule:
      interval: weekly
  # Self-hosted Caddy build (caddy builder + runtime, both pinned by digest).
  - package-ecosystem: 'docker'
    directory: '/deploy/selfhost/caddy'
    schedule:
      interval: weekly
  - package-ecosystem: 'docker'
    directory: '/deploy/selfhost/egress-fence'
    schedule:
      interval: weekly
  - package-ecosystem: 'docker'
    directory: '/deploy/selfhost/key-agent'
    schedule:
      interval: weekly
  - package-ecosystem: 'docker'
    directory: '/deploy/selfhost/metadata-proxy'
    schedule:
      interval: weekly
  - package-ecosystem: 'npm'
    directory: '/deploy/selfhost/metadata-proxy'
    schedule:
      interval: weekly
