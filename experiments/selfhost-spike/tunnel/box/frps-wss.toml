# Box-side frps. Node-facing control port; every per-node proxy binds on loopback only,
# so only the local Worker (celld) can reach nodes.
bindAddr = "127.0.0.1"   # only Caddy (same box) reaches frps; nodes come in via wss on 443
bindPort = 7000
proxyBindAddr = "127.0.0.1"
vhostHTTPPort = 7480
tcpmuxHTTPConnectPort = 7490
allowPorts = [{ start = 17000, end = 17999 }]
transport.tls.force = false  # wss is TLS-terminated by Caddy, so frps sees plain WebSocket
# Q5: per-node authorization via server plugin (see box/authz/). Shared token is
# only a first gate; the plugin checks the per-node credential and the claimed slot.
auth.method = "token"
auth.token = "spike-shared-token"
webServer.addr = "127.0.0.1"
webServer.port = 7500
log.to = "console"
log.level = "info"

[[httpPlugins]]
name = "sam-node-authz"
addr = "127.0.0.1:7600"
path = "/frp/handler"
ops = ["Login", "NewProxy"]
